id: trees
title: Binary trees
intro: |
  A binary tree is a graph where every node has at most two children (`left`, `right`) and there are no
  cycles. So tree searches are graph searches **without the `seen` set**, and you always know which
  child comes first. Everything here is one question: *what do I do at a node, and when, relative to its children?*
problems:
  - Binary Tree Inorder Traversal
  - Maximum Depth of Binary Tree
  - Binary Tree Level Order Traversal
  - Validate Binary Search Tree
  - Diameter of Binary Tree
  - Path Sum
atoms: []
skills:
  - id: trees.orders
    name: pre-order, in-order, post-order (recursive)
    teach: |
      ```python
      # The node type LeetCode gives you. left / right are TreeNode or None (no child).
      class TreeNode:
          def __init__(self, val=0, left=None, right=None):
              self.val, self.left, self.right = val, left, right

      # A recursive walk visits every node once. The three orders differ ONLY in when you record the node.
      def walk(node):
          if node is None:        # empty subtree: nothing to visit (the base case that stops the recursion)
              return
          # PRE-order:  record node.val here  -> the node comes BEFORE its children
          walk(node.left)
          # IN-order:   record node.val here  -> the node comes BETWEEN its left and right subtrees
          walk(node.right)
          # POST-order: record node.val here  -> the node comes AFTER both children

      #        1
      #       / \          preorder  [1, 2, 4, 5, 3]   root first, then the whole left subtree, then the right
      #      2   3         inorder   [4, 2, 5, 1, 3]   whole left subtree, root, whole right subtree
      #     / \            postorder [4, 5, 2, 3, 1]   both subtrees first, root last
      #    4   5
      ```
      Use when: pre-order to copy or serialize (a parent before its children) · in-order on a binary
      **search** tree gives the values **sorted** · post-order when a node needs its children's results first.
      Cost: O(n) time, O(h) recursion depth (h = height of the tree).
    cards:
      - id: a
        prompt: |
          **Given** (see setup): `TreeNode` and `build(vals)`, which makes a tree from a LeetCode level-order list
          (`None` = no node), e.g. `build([1, 2, 3, 4, 5])` is the tree drawn in the lesson.

          - **Write** `preorder(root)`, `inorder(root)` and `postorder(root)`, recursively.
          - **Returns**: each a `list` of the node values in that order; `[]` for an empty tree (`root is None`).
          - **Checked on**: the lesson's tree, an empty tree, a single node, a lopsided tree with a missing child,
            and 300 random trees (chains, zigzags, full and random shapes).
        setup: |
          class TreeNode:
              def __init__(self, val=0, left=None, right=None):
                  self.val, self.left, self.right = val, left, right

          def build(vals):
              """LeetCode level-order list -> tree (None = no node)."""
              if not vals:
                  return None
              nodes = [None if v is None else TreeNode(v) for v in vals]
              kids = iter(nodes[1:])
              for n in nodes:
                  if n is not None:
                      n.left, n.right = next(kids, None), next(kids, None)
              return nodes[0]
        starter: |
          def preorder(root):
              pass

          def inorder(root):
              pass

          def postorder(root):
              pass
        solution: |
          def preorder(root):
              out = []
              def walk(node):
                  if node is None:
                      return
                  out.append(node.val)
                  walk(node.left)
                  walk(node.right)
              walk(root)
              return out

          def inorder(root):
              out = []
              def walk(node):
                  if node is None:
                      return
                  walk(node.left)
                  out.append(node.val)
                  walk(node.right)
              walk(root)
              return out

          def postorder(root):
              out = []
              def walk(node):
                  if node is None:
                      return
                  walk(node.left)
                  walk(node.right)
                  out.append(node.val)
              walk(root)
              return out
        check: |
          t = build([1, 2, 3, 4, 5])
          for f, want in [(preorder, [1, 2, 4, 5, 3]), (inorder, [4, 2, 5, 1, 3]), (postorder, [4, 5, 2, 3, 1])]:
              got = f(t)
              assert got == want, f"{f.__name__}(lesson tree) = {got!r}, expected {want!r}"
              assert f(None) == [], f"{f.__name__}(None) = {f(None)!r}, expected []"
              assert f(build([7])) == [7], f"{f.__name__}(single node) = {f(build([7]))!r}"
          lop = build([1, None, 2, 3])      # 1 -> right child 2 -> left child 3
          assert preorder(lop) == [1, 2, 3], f"preorder = {preorder(lop)!r}, expected [1, 2, 3]"
          assert inorder(lop) == [1, 3, 2], f"inorder = {inorder(lop)!r}, expected [1, 3, 2]"
          assert postorder(lop) == [3, 2, 1], f"postorder = {postorder(lop)!r}, expected [3, 2, 1]"

          from cardtest import against, rand_cases

          def _shape(r, nmax=12):
              """Random tree shape: kids[i] = [left id, right id] (node 0 = root); empty, chains, zigzags, full, random."""
              n = r.choice([0, 1, 2, 3] + [r.randint(4, nmax)] * 4)
              mode = r.choice(["random", "random", "random", "left", "right", "zigzag", "full"])
              kids = [[None, None] for _ in range(n)]
              for i in range(1, n):
                  if mode == "random":
                      p, s = r.choice([(p, s) for p in range(i) for s in (0, 1) if kids[p][s] is None])
                  elif mode == "full":
                      p, s = (i - 1) // 2, (i - 1) % 2
                  else:
                      p, s = i - 1, {"left": 0, "right": 1}.get(mode, r.randint(0, 1))
                  kids[p][s] = i
              return kids

          def _level(kids, vals):
              """Shape + values -> LeetCode level-order list, the input of build()."""
              out, q = [], ([0] if kids else [])
              for x in q:
                  out.append(None if x is None else vals[x])
                  if x is not None:
                      q += kids[x]
              while out and out[-1] is None:
                  out.pop()
              return out

          _show = lambda v: f"(build({v!r}))"

          # references written straight from the definitions
          def _pre(v):
              f = lambda n: [] if n is None else [n.val] + f(n.left) + f(n.right)
              return f(build(v))

          def _in(v):
              f = lambda n: [] if n is None else f(n.left) + [n.val] + f(n.right)
              return f(build(v))

          def _post(v):
              f = lambda n: [] if n is None else f(n.left) + f(n.right) + [n.val]
              return f(build(v))

          def _gen(r):
              kids = _shape(r)
              return (_level(kids, r.sample(range(1, 100), len(kids))),)

          _cases = [([],), ([7],), ([1, 2],), ([1, None, 2],), ([1, 2, 3, 4, 5, 6, 7],),
                    ([1, 2, None, 3, None, 4],), ([1, None, 2, 3, 4, None, 5],)] + rand_cases(_gen, 300)
          for _f, _r in [(preorder, _pre), (inorder, _in), (postorder, _post)]:
              against(lambda v, f=_f: f(build(v)), _r, _cases, show=_show, name=_f.__name__)
      - id: b
        prompt: |
          A **binary search tree** (BST) is valid when, for every node, all values in its left subtree are
          smaller and all values in its right subtree are larger. Equivalently: its **in-order** list is strictly increasing.

          - **Given**: `TreeNode`, `build` (see setup).
          - **Write** `is_valid_bst(root)` using an in-order traversal.
          - **Returns**: a `bool`, `True` / `False` (an empty tree is valid; duplicates make it invalid).
          - **Checked on**: a valid BST, a tree where a deep node breaks the rule (each parent-child pair looks fine), duplicates, empty,
            and 300 random trees (valid BSTs, and BSTs with one value swapped, repeated or replaced).
        setup: |
          class TreeNode:
              def __init__(self, val=0, left=None, right=None):
                  self.val, self.left, self.right = val, left, right

          def build(vals):
              if not vals:
                  return None
              nodes = [None if v is None else TreeNode(v) for v in vals]
              kids = iter(nodes[1:])
              for n in nodes:
                  if n is not None:
                      n.left, n.right = next(kids, None), next(kids, None)
              return nodes[0]
        starter: |
          def is_valid_bst(root):
              pass
        solution: |
          def is_valid_bst(root):
              vals = []
              def walk(node):
                  if node is None:
                      return
                  walk(node.left)
                  vals.append(node.val)
                  walk(node.right)
              walk(root)
              return all(a < b for a, b in zip(vals, vals[1:]))
        check: |
          cases = [([5, 3, 8, 1, 4, 7, 9], True), ([5, 3, 8, 1, 6, 7, 9], False), ([2, 2, 2], False), ([], True), ([1], True)]
          for vals, want in cases:
              got = is_valid_bst(build(vals))
              assert got is want, f"is_valid_bst(build({vals})) = {got!r}, expected {want}"

          from cardtest import against, rand_cases

          def _shape(r, nmax=12):
              """Random tree shape: kids[i] = [left id, right id] (node 0 = root); empty, chains, zigzags, full, random."""
              n = r.choice([0, 1, 2, 3] + [r.randint(4, nmax)] * 4)
              mode = r.choice(["random", "random", "random", "left", "right", "zigzag", "full"])
              kids = [[None, None] for _ in range(n)]
              for i in range(1, n):
                  if mode == "random":
                      p, s = r.choice([(p, s) for p in range(i) for s in (0, 1) if kids[p][s] is None])
                  elif mode == "full":
                      p, s = (i - 1) // 2, (i - 1) % 2
                  else:
                      p, s = i - 1, {"left": 0, "right": 1}.get(mode, r.randint(0, 1))
                  kids[p][s] = i
              return kids

          def _level(kids, vals):
              """Shape + values -> LeetCode level-order list, the input of build()."""
              out, q = [], ([0] if kids else [])
              for x in q:
                  out.append(None if x is None else vals[x])
                  if x is not None:
                      q += kids[x]
              while out and out[-1] is None:
                  out.pop()
              return out

          def _ref(v):
              # different method: every node must lie strictly inside the (low, high) range set by its ancestors
              def ok(n, lo, hi):
                  return n is None or (lo < n.val < hi and ok(n.left, lo, n.val) and ok(n.right, n.val, hi))
              return ok(build(v), float("-inf"), float("inf"))

          def _gen(r):
              # a valid BST on a random shape, then (often) one value swapped, duplicated or replaced
              kids = _shape(r)
              order = []
              def walk(i):
                  if i is not None:
                      walk(kids[i][0])
                      order.append(i)
                      walk(kids[i][1])
              walk(0 if kids else None)
              vals = [0] * len(kids)
              for rank, i in enumerate(order):
                  vals[i] = 3 * rank + r.randint(0, 2)
              if len(kids) >= 2 and r.random() < 0.6:
                  a, b = r.sample(range(len(kids)), 2)
                  k = r.random()
                  if k < 0.4:
                      vals[a], vals[b] = vals[b], vals[a]
                  elif k < 0.7:
                      vals[a] = vals[b]
                  else:
                      vals[a] = r.randint(-2, 3 * len(kids) + 2)
              return (_level(kids, vals),)

          _edge = [([5, 4, 6, None, None, 3, 7],), ([5, 1, 8, None, 6],), ([1, 1],), ([1, None, 1],), ([2, 1, 3],),
                   ([3, 1, 5, 0, 2, 4, 6],), ([3, None, 30, 10, None, None, 15, None, 45],)]
          against(lambda v: is_valid_bst(build(v)), _ref, _edge + rand_cases(_gen, 300),
                  same=lambda got, exp: got is exp, show=lambda v: f"(build({v!r}))", name="is_valid_bst")

  - id: trees.dfs-stack
    name: the same orders with an explicit stack (iterative DFS)
    teach: |
      Recursion secretly keeps a **stack** of the nodes you are in the middle of. Managing that stack yourself
      gives the same orders without recursion (Python stops recursing at about 1000 levels: `RecursionError`).
      ```python
      # A Python list as a stack: stack.append(x) puts x on top; stack.pop() removes and returns the top (last pushed).

      # PRE-order: pop a node, record it, push its children. Push RIGHT first so LEFT is on top -> handled first.
      def preorder(root):
          out, stack = [], ([root] if root else [])
          while stack:
              node = stack.pop()
              out.append(node.val)
              if node.right: stack.append(node.right)
              if node.left:  stack.append(node.left)
          return out                          # lesson tree -> [1, 2, 4, 5, 3]

      # IN-order: dive left as far as possible (stacking the path); when stuck, pop a node, record it, go right.
      def inorder(root):
          out, stack, node = [], [], root
          while stack or node:
              while node:                     # go down-left, remembering every node on the way
                  stack.append(node)
                  node = node.left
              node = stack.pop()              # the leftmost node not yet recorded
              out.append(node.val)
              node = node.right               # now visit its right subtree the same way
          return out                          # -> [4, 2, 5, 1, 3]

      # POST-order: a pre-order that pushes LEFT first records node, right, left. Reversed: left, right, node.
      def postorder(root):
          out, stack = [], ([root] if root else [])
          while stack:
              node = stack.pop()
              out.append(node.val)
              if node.left:  stack.append(node.left)
              if node.right: stack.append(node.right)
          return out[::-1]                    # -> [4, 5, 2, 3, 1]
      ```
      Use when: the tree may be deeper than ~1000 levels, or the interviewer asks for the iterative version.
      Pitfall: in pre-order, pushing `left` before `right` gives root, right, left (wrong order).
    cards:
      - id: a
        prompt: |
          **Given** (see setup): `TreeNode`, `build(vals)`, and `chain(n)`, a tree of depth `n` where each node
          only has a left child (values 1, 2, …, n from the top).

          - **Write** `preorder(root)`, `inorder(root)`, `postorder(root)` **without recursion** (explicit stack).
          - **Returns**: each a `list` of values in that order, `[]` for `None`.
          - **Checked on**: the lesson's tree, an empty tree, 300 random small trees (chains, zigzags, full and random shapes),
            and `chain(3000)` (a recursive version crashes there).
        setup: |
          class TreeNode:
              def __init__(self, val=0, left=None, right=None):
                  self.val, self.left, self.right = val, left, right

          def build(vals):
              if not vals:
                  return None
              nodes = [None if v is None else TreeNode(v) for v in vals]
              kids = iter(nodes[1:])
              for n in nodes:
                  if n is not None:
                      n.left, n.right = next(kids, None), next(kids, None)
              return nodes[0]

          def chain(n):
              """1 -> 2 -> ... -> n, each the LEFT child of the previous one."""
              root = None
              for v in range(n, 0, -1):
                  root = TreeNode(v, left=root)
              return root
        starter: |
          def preorder(root):
              pass

          def inorder(root):
              pass

          def postorder(root):
              pass
        solution: |
          def preorder(root):
              out, stack = [], ([root] if root else [])
              while stack:
                  node = stack.pop()
                  out.append(node.val)
                  if node.right:
                      stack.append(node.right)
                  if node.left:
                      stack.append(node.left)
              return out

          def inorder(root):
              out, stack, node = [], [], root
              while stack or node:
                  while node:
                      stack.append(node)
                      node = node.left
                  node = stack.pop()
                  out.append(node.val)
                  node = node.right
              return out

          def postorder(root):
              out, stack = [], ([root] if root else [])
              while stack:
                  node = stack.pop()
                  out.append(node.val)
                  if node.left:
                      stack.append(node.left)
                  if node.right:
                      stack.append(node.right)
              return out[::-1]
        check: |
          t = build([1, 2, 3, 4, 5])
          for f, want in [(preorder, [1, 2, 4, 5, 3]), (inorder, [4, 2, 5, 1, 3]), (postorder, [4, 5, 2, 3, 1])]:
              got = f(t)
              assert got == want, f"{f.__name__}(lesson tree) = {got!r}, expected {want!r}"
              assert f(None) == [], f"{f.__name__}(None) = {f(None)!r}, expected []"
          deep = chain(3000)
          try:
              p, i, q = preorder(deep), inorder(deep), postorder(deep)
          except RecursionError:
              raise AssertionError("RecursionError on a 3000-deep tree: use an explicit stack, not recursion")
          assert p == list(range(1, 3001)), f"preorder(chain(3000)) starts {p[:5]!r}..., expected [1, 2, 3, ...]"
          assert i == list(range(3000, 0, -1)), f"inorder(chain(3000)) starts {i[:5]!r}..., expected [3000, 2999, ...]"
          assert q == list(range(3000, 0, -1)), f"postorder(chain(3000)) starts {q[:5]!r}..., expected [3000, 2999, ...]"

          from cardtest import against, rand_cases

          def _shape(r, nmax=12):
              """Random tree shape: kids[i] = [left id, right id] (node 0 = root); empty, chains, zigzags, full, random."""
              n = r.choice([0, 1, 2, 3] + [r.randint(4, nmax)] * 4)
              mode = r.choice(["random", "random", "random", "left", "right", "zigzag", "full"])
              kids = [[None, None] for _ in range(n)]
              for i in range(1, n):
                  if mode == "random":
                      p, s = r.choice([(p, s) for p in range(i) for s in (0, 1) if kids[p][s] is None])
                  elif mode == "full":
                      p, s = (i - 1) // 2, (i - 1) % 2
                  else:
                      p, s = i - 1, {"left": 0, "right": 1}.get(mode, r.randint(0, 1))
                  kids[p][s] = i
              return kids

          def _level(kids, vals):
              """Shape + values -> LeetCode level-order list, the input of build()."""
              out, q = [], ([0] if kids else [])
              for x in q:
                  out.append(None if x is None else vals[x])
                  if x is not None:
                      q += kids[x]
              while out and out[-1] is None:
                  out.pop()
              return out

          _show = lambda v: f"(build({v!r}))"

          # references written straight from the definitions (small trees only)
          def _pre(v):
              f = lambda n: [] if n is None else [n.val] + f(n.left) + f(n.right)
              return f(build(v))

          def _in(v):
              f = lambda n: [] if n is None else f(n.left) + [n.val] + f(n.right)
              return f(build(v))

          def _post(v):
              f = lambda n: [] if n is None else f(n.left) + f(n.right) + [n.val]
              return f(build(v))

          def _gen(r):
              kids = _shape(r)
              return (_level(kids, r.sample(range(1, 100), len(kids))),)

          _cases = [([7],), ([1, 2],), ([1, None, 2],), ([1, 2, 3, 4, 5, 6, 7],),
                    ([1, 2, None, 3, None, 4],), ([1, None, 2, 3, 4, None, 5],)] + rand_cases(_gen, 300)
          for _f, _r in [(preorder, _pre), (inorder, _in), (postorder, _post)]:
              against(lambda v, f=_f: f(build(v)), _r, _cases, show=_show, name=_f.__name__)
      - id: b
        prompt: |
          The stack can hold more than nodes: push `(node, depth)` pairs to carry information down.

          - **Given**: `TreeNode`, `build`, `chain` (see setup).
          - **Write** `max_depth(root)` iteratively, with a stack of `(node, depth)` pairs.
          - **Returns**: the number of nodes on the longest root-to-leaf path (`0` for an empty tree).
          - **Checked on**: the lesson's tree (3), empty (0), a lopsided tree, 300 random small trees, and `chain(3000)` (3000).
        setup: |
          class TreeNode:
              def __init__(self, val=0, left=None, right=None):
                  self.val, self.left, self.right = val, left, right

          def build(vals):
              if not vals:
                  return None
              nodes = [None if v is None else TreeNode(v) for v in vals]
              kids = iter(nodes[1:])
              for n in nodes:
                  if n is not None:
                      n.left, n.right = next(kids, None), next(kids, None)
              return nodes[0]

          def chain(n):
              root = None
              for v in range(n, 0, -1):
                  root = TreeNode(v, left=root)
              return root
        starter: |
          def max_depth(root):
              pass
        solution: |
          def max_depth(root):
              best, stack = 0, ([(root, 1)] if root else [])
              while stack:
                  node, depth = stack.pop()
                  best = max(best, depth)
                  if node.left:
                      stack.append((node.left, depth + 1))
                  if node.right:
                      stack.append((node.right, depth + 1))
              return best
        check: |
          for vals, want in [([1, 2, 3, 4, 5], 3), ([], 0), ([1], 1), ([1, None, 2, None, 3, None, 4], 4)]:
              got = max_depth(build(vals))
              assert got == want, f"max_depth(build({vals})) = {got!r}, expected {want}"
          try:
              got = max_depth(chain(3000))
          except RecursionError:
              raise AssertionError("RecursionError: use a stack of (node, depth) pairs, not recursion")
          assert got == 3000, f"max_depth(chain(3000)) = {got!r}, expected 3000"

          from cardtest import against, rand_cases

          def _shape(r, nmax=12):
              """Random tree shape: kids[i] = [left id, right id] (node 0 = root); empty, chains, zigzags, full, random."""
              n = r.choice([0, 1, 2, 3] + [r.randint(4, nmax)] * 4)
              mode = r.choice(["random", "random", "random", "left", "right", "zigzag", "full"])
              kids = [[None, None] for _ in range(n)]
              for i in range(1, n):
                  if mode == "random":
                      p, s = r.choice([(p, s) for p in range(i) for s in (0, 1) if kids[p][s] is None])
                  elif mode == "full":
                      p, s = (i - 1) // 2, (i - 1) % 2
                  else:
                      p, s = i - 1, {"left": 0, "right": 1}.get(mode, r.randint(0, 1))
                  kids[p][s] = i
              return kids

          def _level(kids, vals):
              """Shape + values -> LeetCode level-order list, the input of build()."""
              out, q = [], ([0] if kids else [])
              for x in q:
                  out.append(None if x is None else vals[x])
                  if x is not None:
                      q += kids[x]
              while out and out[-1] is None:
                  out.pop()
              return out

          def _ref(v):
              # different method: count levels, replacing each level by the list of its children
              level, depth = [n for n in [build(v)] if n], 0
              while level:
                  depth += 1
                  level = [c for n in level for c in (n.left, n.right) if c]
              return depth

          def _gen(r):
              kids = _shape(r)
              return (_level(kids, r.sample(range(1, 100), len(kids))),)

          _edge = [([1, 2],), ([1, None, 2],), ([1, 2, 3, None, None, 4, None, 5],), ([1, 2, 3, None, 4, None, None, 5],)]
          against(lambda v: max_depth(build(v)), _ref, _edge + rand_cases(_gen, 300),
                  show=lambda v: f"(build({v!r}))", name="max_depth")

  - id: trees.bfs
    name: level by level (BFS) - queue version and recursive version
    teach: |
      BFS visits the tree **level by level**: the root (depth 0), then all depth-1 nodes, then depth 2…
      A **queue** serves nodes in the order they arrived, which is exactly that order.
      ```python
      from collections import deque
      # deque([items]) -> a queue. q.append(x) adds x at the back; q.popleft() removes and returns the front. Both O(1).

      def level_order(root):                  # -> list of levels, each a list of values, top to bottom, left to right
          levels, q = [], deque([root] if root else [])
          while q:
              level = []
              for _ in range(len(q)):         # right now the queue holds exactly one full level
                  node = q.popleft()
                  level.append(node.val)
                  if node.left:  q.append(node.left)
                  if node.right: q.append(node.right)
              levels.append(level)
          return levels                       # lesson tree -> [[1], [2, 3], [4, 5]]

      # Recursive version: a DFS that knows each node's depth drops the node into levels[depth].
      # Visiting left before right keeps every level in left-to-right order.
      def level_order_rec(root):
          levels = []
          def dfs(node, depth):
              if node is None:
                  return
              if depth == len(levels):        # first node ever seen at this depth: open a new level
                  levels.append([])
              levels[depth].append(node.val)
              dfs(node.left, depth + 1)
              dfs(node.right, depth + 1)
          dfs(root, 0)
          return levels                       # same result: [[1], [2, 3], [4, 5]]
      ```
      Use when: anything "per level" (level averages, right side view) · "closest / minimum depth": with the queue,
      the **first leaf** you pop is the closest one, so you can stop there.
      Pitfall: use `deque.popleft()`, not `list.pop(0)` (which shifts the whole list: O(n) per pop).
