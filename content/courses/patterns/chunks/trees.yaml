  - id: trees.recursion-results
    name: returning results up vs passing information down
    teach: |
      Most tree problems are one of two recursions:
      ```python
      # BOTTOM-UP (post-order): the function returns a fact about a subtree, built from its children's answers.
      def height(node):                 # number of nodes on the longest path from node down to a leaf
          if node is None:
              return 0                  # an empty subtree has height 0
          return 1 + max(height(node.left), height(node.right))
      # lesson tree: height(4) = 1, height(2) = 1 + max(1, 1) = 2, height(1) = 1 + max(2, 1) = 3

      # TOP-DOWN (pre-order): pass what you know so far as an argument; decide when you reach a leaf.
      def has_path_sum(node, target):   # is there a root-to-leaf path whose values add up to target?
          if node is None:
              return False
          target -= node.val            # the amount still needed below this node
          if node.left is None and node.right is None:     # a leaf: the path ends here
              return target == 0
          return has_path_sum(node.left, target) or has_path_sum(node.right, target)
      # lesson tree: has_path_sum(root, 8) -> True (1 + 2 + 5), has_path_sum(root, 3) -> False (1 + 2 stops at a non-leaf)
      ```
      Use when: bottom-up for sizes, heights, "is it balanced", diameter · top-down for root-to-leaf paths
      and constraints that come from above.
      Pitfall: a "path to a leaf" must end at a node with **no** children, not at a node with one missing child.
    cards:
      - id: a
        prompt: |
          **Given**: `TreeNode`, `build` (see setup).

          - **Write** `height(root)`: bottom-up recursion. **Returns** the number of nodes on the longest root-to-leaf path (`0` if empty).
          - **Write** `has_path_sum(root, target)`: top-down recursion. **Returns** a `bool`: `True` if some root-to-**leaf**
            path's values sum to `target`, else `False` (`False` for an empty tree).
          - **Checked on**: the lesson's tree, an empty tree, a node with a single child, negative values, and 300 random
            trees (targets that match a root-to-leaf sum, a sum that stops at a non-leaf, or neither).
        setup: |
          class TreeNode:
              def __init__(self, val=0, left=None, right=None):
                  self.val, self.left, self.right = val, left, right

          def build(vals):
              if not vals:
                  return None
              nodes = [None if v is None else TreeNode(v) for v in vals]
              kids = iter(nodes[1:])
              for n in nodes:
                  if n is not None:
                      n.left, n.right = next(kids, None), next(kids, None)
              return nodes[0]
        starter: |
          def height(root):
              pass

          def has_path_sum(root, target):
              pass
        solution: |
          def height(root):
              if root is None:
                  return 0
              return 1 + max(height(root.left), height(root.right))

          def has_path_sum(root, target):
              if root is None:
                  return False
              target -= root.val
              if root.left is None and root.right is None:
                  return target == 0
              return has_path_sum(root.left, target) or has_path_sum(root.right, target)
        check: |
          t = build([1, 2, 3, 4, 5])
          for vals, want in [([1, 2, 3, 4, 5], 3), ([], 0), ([1, None, 2, None, 3], 3)]:
              assert height(build(vals)) == want, f"height(build({vals})) = {height(build(vals))!r}, expected {want}"
          for target, want in [(8, True), (7, True), (4, True), (3, False), (1, False)]:
              got = has_path_sum(t, target)
              assert got is want, f"has_path_sum(lesson tree, {target}) = {got!r}, expected {want}"
          assert has_path_sum(None, 0) is False, "an empty tree has no path: expected False"
          one_child = build([1, 2])          # 1 has only a left child: the only leaf path is 1 -> 2
          assert has_path_sum(one_child, 1) is False, "1 alone is not a root-to-LEAF path (1 has a child)"
          assert has_path_sum(build([-2, None, -3]), -5) is True, "negative values: -2 + -3 = -5 expected True"

          from cardtest import against, rand_cases

          def _shape(r, nmax=12):
              """Random tree shape: kids[i] = [left id, right id] (node 0 = root); empty, chains, zigzags, full, random."""
              n = r.choice([0, 1, 2, 3] + [r.randint(4, nmax)] * 4)
              mode = r.choice(["random", "random", "random", "left", "right", "zigzag", "full"])
              kids = [[None, None] for _ in range(n)]
              for i in range(1, n):
                  if mode == "random":
                      p, s = r.choice([(p, s) for p in range(i) for s in (0, 1) if kids[p][s] is None])
                  elif mode == "full":
                      p, s = (i - 1) // 2, (i - 1) % 2
                  else:
                      p, s = i - 1, {"left": 0, "right": 1}.get(mode, r.randint(0, 1))
                  kids[p][s] = i
              return kids

          def _level(kids, vals):
              """Shape + values -> LeetCode level-order list, the input of build()."""
              out, q = [], ([0] if kids else [])
              for x in q:
                  out.append(None if x is None else vals[x])
                  if x is not None:
                      q += kids[x]
              while out and out[-1] is None:
                  out.pop()
              return out

          def _sums(v):
              """(sum of the values from the root down to node, node is a leaf) for every node."""
              out, todo = [], [(build(v), 0)]
              while todo:
                  n, s = todo.pop()
                  if n is not None:
                      out.append((s + n.val, n.left is None and n.right is None))
                      todo += [(n.left, s + n.val), (n.right, s + n.val)]
              return out

          def _ref_height(v):
              # different method: count levels, replacing each level by the list of its children
              level, h = [n for n in [build(v)] if n], 0
              while level:
                  h += 1
                  level = [c for n in level for c in (n.left, n.right) if c]
              return h

          def _ref_path(v, target):
              # brute force: list every root-to-leaf sum
              return any(s == target for s, leaf in _sums(v) if leaf)

          def _gen_tree(r):
              kids = _shape(r)
              return (_level(kids, [r.randint(-5, 5) for _ in kids]),)

          def _gen_path(r):
              (v,) = _gen_tree(r)
              sums, k = _sums(v), r.random()
              if sums and k < 0.4:
                  t = r.choice([s for s, leaf in sums if leaf])        # a real root-to-leaf sum
              elif sums and k < 0.75:
                  t = r.choice(sums)[0]                                # often a path that stops at a non-leaf
              else:
                  t = r.randint(-10, 10)
              return (v, t)

          _show = lambda v, t=None: f"(build({v!r})" + ("" if t is None else f", {t}") + ")"
          against(lambda v: height(build(v)), _ref_height,
                  [([1, 2],), ([1, None, 2],), ([1, 2, 3, None, 4, None, None, 5],)] + rand_cases(_gen_tree, 300),
                  show=_show, name="height")
          _edge = [([1, 2], 3), ([1, 2], 1), ([1, None, 2], 1), ([1, 2, 3], 4), ([0, 1, -1], 0), ([5, -5], 0),
                   ([1, -2, 3, None, 1], 0), ([1, 2, 3, None, 4], 3), ([], 0)]
          against(lambda v, t: has_path_sum(build(v), t), _ref_path, _edge + rand_cases(_gen_path, 300),
                  same=lambda got, exp: got is exp, show=_show, name="has_path_sum")
      - id: b
        prompt: |
          The **diameter** of a tree is the number of **edges** on the longest path between any two nodes
          (the path may skip the root). At each node, the longest path through it uses the heights of its two subtrees.

          - **Given**: `TreeNode`, `build` (see setup).
          - **Write** `diameter(root)` with ONE bottom-up recursion that returns heights and updates a best-so-far
            (`nonlocal`).
          - **Returns**: an `int`, `0` for an empty tree or a single node.
          - **Checked on**: the lesson's tree (3: 4 -> 2 -> 1 -> 3), a tree whose longest path avoids the root, empty, single node,
            and 300 random trees.
        setup: |
          class TreeNode:
              def __init__(self, val=0, left=None, right=None):
                  self.val, self.left, self.right = val, left, right

          def build(vals):
              if not vals:
                  return None
              nodes = [None if v is None else TreeNode(v) for v in vals]
              kids = iter(nodes[1:])
              for n in nodes:
                  if n is not None:
                      n.left, n.right = next(kids, None), next(kids, None)
              return nodes[0]
        starter: |
          def diameter(root):
              pass
        solution: |
          def diameter(root):
              best = 0
              def height(node):
                  nonlocal best
                  if node is None:
                      return 0
                  left, right = height(node.left), height(node.right)
                  best = max(best, left + right)
                  return 1 + max(left, right)
              height(root)
              return best
        check: |
          avoid_root = build([1, 2, None, 3, 4, 5, None, None, 6])   # longest path 5 - 3 - 2 - 4 - 6 stays below the root
          for tree, want, name in [(build([1, 2, 3, 4, 5]), 3, "lesson tree"), (avoid_root, 4, "path avoiding the root"),
                                   (None, 0, "empty"), (build([1]), 0, "single node")]:
              got = diameter(tree)
              assert got == want, f"diameter({name}) = {got!r}, expected {want}"

          from cardtest import against, rand_cases

          def _shape(r, nmax=12):
              """Random tree shape: kids[i] = [left id, right id] (node 0 = root); empty, chains, zigzags, full, random."""
              n = r.choice([0, 1, 2, 3] + [r.randint(4, nmax)] * 4)
              mode = r.choice(["random", "random", "random", "left", "right", "zigzag", "full"])
              kids = [[None, None] for _ in range(n)]
              for i in range(1, n):
                  if mode == "random":
                      p, s = r.choice([(p, s) for p in range(i) for s in (0, 1) if kids[p][s] is None])
                  elif mode == "full":
                      p, s = (i - 1) // 2, (i - 1) % 2
                  else:
                      p, s = i - 1, {"left": 0, "right": 1}.get(mode, r.randint(0, 1))
                  kids[p][s] = i
              return kids

          def _level(kids, vals):
              """Shape + values -> LeetCode level-order list, the input of build()."""
              out, q = [], ([0] if kids else [])
              for x in q:
                  out.append(None if x is None else vals[x])
                  if x is not None:
                      q += kids[x]
              while out and out[-1] is None:
                  out.pop()
              return out

          def _ref(v):
              # brute force: BFS from every node over the undirected edges, longest distance found
              adj, todo = {}, [build(v)]
              while todo:
                  n = todo.pop()
                  if n is not None:
                      adj.setdefault(n, [])
                      for c in (n.left, n.right):
                          if c is not None:
                              adj[n].append(c)
                              adj.setdefault(c, []).append(n)
                              todo.append(c)
              best = 0
              for s in adj:
                  seen, level, d = {s}, [s], 0
                  while level:
                      best = max(best, d)
                      level = [y for x in level for y in adj[x] if y not in seen]
                      seen.update(level)
                      d += 1
              return best

          def _gen(r):
              kids = _shape(r)
              return (_level(kids, r.sample(range(1, 100), len(kids))),)

          _edge = [([1, 2],), ([1, None, 2],), ([1, 2, 3],), ([1, 2, None, 3, 4, 5, None, None, 6],),
                   ([1, 2, 3, 4, 5, None, None, 6, None, None, 7],), ([1, 2, None, 3, None, 4],)]
          against(lambda v: diameter(build(v)), _ref, _edge + rand_cases(_gen, 300),
                  show=lambda v: f"(build({v!r}))", name="diameter")
