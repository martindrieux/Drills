          from collections import deque

          def level_order(root):
              levels, q = [], deque([root] if root else [])
              while q:
                  level = []
                  for _ in range(len(q)):
                      node = q.popleft()
                      level.append(node.val)
                      if node.left:
                          q.append(node.left)
                      if node.right:
                          q.append(node.right)
                  levels.append(level)
              return levels

          def level_order_rec(root):
              levels = []
              def dfs(node, depth):
                  if node is None:
                      return
                  if depth == len(levels):
                      levels.append([])
                  levels[depth].append(node.val)
                  dfs(node.left, depth + 1)
                  dfs(node.right, depth + 1)
