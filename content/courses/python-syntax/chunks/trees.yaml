  - id: trees.dfs-state
    name: passing state down the recursion
    teach: |
      ```python
      def depth_sum(node, depth):    # state from above = an argument: each call has its own, nothing to undo
          if not node:
              return 0
          return depth + depth_sum(node.left, depth + 1) + depth_sum(node.right, depth + 1)
      depth_sum(build([1, 2, 3]), 0)   # 2  (0 + 1 + 1)
      # leaf test (for root-to-leaf answers): not node.left and not node.right
      ```
    cards:
      - id: a
        prompt: |
          - **Given** (see setup): `TreeNode` (`.val`, `.left`, `.right`) and `build(vals)`, which makes a tree from a level-order list (`None` = no node); `root = build([5, 4, 8, 11, None, 13, 4, 7, 2, None, None, None, 1])`.
          - **Write** `has_path_sum(node, target)`, recursively, passing `target - node.val` down.
          - **Returns**: `True` if some root-to-**leaf** path (ending at a node with no children) sums to `target`, else `False`; `False` for an empty tree, even when `target == 0`.
          - **Checked on**: `root` with 22 and 26 (True) and 9 (a path that stops above a leaf: False), empty, nodes with one child, negative values, and 300 random trees.
        setup: |
          class TreeNode:
              def __init__(self, val=0, left=None, right=None):
                  self.val, self.left, self.right = val, left, right

          def build(vals):
              nodes = [None if v is None else TreeNode(v) for v in vals]
              kids = iter(nodes[1:])
              for node in nodes:
                  if node:
                      node.left, node.right = next(kids, None), next(kids, None)
              return nodes[0] if nodes else None

          root = build([5, 4, 8, 11, None, 13, 4, 7, 2, None, None, None, 1])
        solution: |
          def has_path_sum(node, target):
              if not node:
                  return False
              if not node.left and not node.right:
                  return node.val == target
              rest = target - node.val
              return has_path_sum(node.left, rest) or has_path_sum(node.right, rest)
        check: |
          assert has_path_sum(root, 22) is True, f"has_path_sum(root, 22) = {has_path_sum(root, 22)!r}"
          assert has_path_sum(root, 26) is True, f"has_path_sum(root, 26) = {has_path_sum(root, 26)!r}"
          assert has_path_sum(root, 9) is False, f"has_path_sum(root, 9) = {has_path_sum(root, 9)!r} (5->4 does not end at a leaf)"
          assert has_path_sum(None, 0) is False, f"has_path_sum(None, 0) = {has_path_sum(None, 0)!r}"
          from cardtest import against, rand_cases

          def _lo(root):  # tree -> its level-order list (what build() takes)
              out, q, i = [], [root], 0
              while i < len(q):
                  n = q[i]
                  i += 1
                  out.append(n.val if n else None)
                  if n:
                      q += [n.left, n.right]
              while out and out[-1] is None:
                  out.pop()
              return out

          def _grow(r, size):  # random shape with `size` nodes, values -5..5 (duplicates, negatives)
              if size == 0:
                  return None
              k = r.randint(0, size - 1)
              return TreeNode(r.randint(-5, 5), _grow(r, k), _grow(r, size - 1 - k))

          def _rand_tree(r):  # level-order list: empty, single, skewed / zigzag chain, random shapes, sparse lists
              kind = r.randrange(6)
              if kind == 0:
                  return r.choice([[], [r.randint(-5, 5)]])
              if kind == 1:
                  root = cur = TreeNode(r.randint(-5, 5))
                  bias = r.choice([0, 1, r.random()])
                  for _ in range(r.randint(1, 9)):
                      kid = TreeNode(r.randint(-5, 5))
                      if r.random() < bias:
                          cur.left = kid
                      else:
                          cur.right = kid
                      cur = kid
                  return _lo(root)
              if kind <= 3:
                  return _lo(_grow(r, r.randint(1, 14)))
              p = r.choice([0.0, 0.25, 0.5])
              return _lo(build([r.randint(-5, 5)] + [None if r.random() < p else r.randint(-5, 5) for _ in range(r.randint(0, 14))]))

          def _on_tree(f):  # cases hold level-order lists; build the tree just before the call
              return lambda vals, *a: f(build(vals), *a)

          def _show(vals, *a):
              return "(" + ", ".join([f"build({vals})"] + [repr(x) for x in a]) + ")"
          def _sums(t):  # (sum from the root down to this node, is it a leaf?) for every node
              out, stack = [], [(t, 0)]
              while stack:
                  n, s = stack.pop()
                  if n:
                      s += n.val
                      out.append((s, not n.left and not n.right))
                      stack += [(n.left, s), (n.right, s)]
              return out
          def _ref(t, target):
              return any(leaf and s == target for s, leaf in _sums(t))
          def _gen(r):
              vals = _rand_tree(r)
              sums = _sums(build(vals))
              target = r.choice(sums)[0] if sums and r.random() < 0.7 else r.randint(-15, 15)  # often a sum stopping at an inner node
              return (vals, target)
          edge = [([], 0), ([1], 1), ([1], 0), ([1, 2], 1), ([1, 2], 3), ([1, None, 2], 1), ([-2, None, -3], -5), ([0, 1, 1], 0)]
          against(_on_tree(has_path_sum), _on_tree(_ref), edge + rand_cases(_gen, 300), name="has_path_sum", show=_show)
      - id: b
        prompt: |
          - **Given** (see setup): `TreeNode` (`.val`, `.left`, `.right`) and `build(vals)`, which makes a tree from a level-order list (`None` = no node); `root = build([3, 1, 4, 3, None, 1, 5])`.
          - **Write** `good(node, best)`, recursively, where `best` = the largest value on the path above `node`. It is called as `good(root, root.val)` on a non-empty tree.
          - **Returns**: `int`, how many nodes (the root included) have `val >= ` every value above them (ties count as good); `0` for `node is None`.
          - **Checked on**: `root` (4), one node, all-equal values, negative values, and 300 random trees.
        setup: |
          class TreeNode:
              def __init__(self, val=0, left=None, right=None):
                  self.val, self.left, self.right = val, left, right

          def build(vals):
              nodes = [None if v is None else TreeNode(v) for v in vals]
              kids = iter(nodes[1:])
              for node in nodes:
                  if node:
                      node.left, node.right = next(kids, None), next(kids, None)
              return nodes[0] if nodes else None

          root = build([3, 1, 4, 3, None, 1, 5])
        solution: |
          def good(node, best):
              if not node:
                  return 0
              n = 1 if node.val >= best else 0
              best = max(best, node.val)
              return n + good(node.left, best) + good(node.right, best)
        check: |
          res = good(root, root.val)
          assert res == 4, f"good(root, root.val) = {res!r}"
          from cardtest import against, rand_cases

          def _lo(root):  # tree -> its level-order list (what build() takes)
              out, q, i = [], [root], 0
              while i < len(q):
                  n = q[i]
                  i += 1
                  out.append(n.val if n else None)
                  if n:
                      q += [n.left, n.right]
              while out and out[-1] is None:
                  out.pop()
              return out

          def _grow(r, size):  # random shape with `size` nodes, values -5..5 (duplicates, negatives)
              if size == 0:
                  return None
              k = r.randint(0, size - 1)
              return TreeNode(r.randint(-5, 5), _grow(r, k), _grow(r, size - 1 - k))

          def _rand_tree(r):  # level-order list: empty, single, skewed / zigzag chain, random shapes, sparse lists
              kind = r.randrange(6)
              if kind == 0:
                  return r.choice([[], [r.randint(-5, 5)]])
              if kind == 1:
                  root = cur = TreeNode(r.randint(-5, 5))
                  bias = r.choice([0, 1, r.random()])
                  for _ in range(r.randint(1, 9)):
                      kid = TreeNode(r.randint(-5, 5))
                      if r.random() < bias:
                          cur.left = kid
                      else:
                          cur.right = kid
                      cur = kid
                  return _lo(root)
              if kind <= 3:
                  return _lo(_grow(r, r.randint(1, 14)))
              p = r.choice([0.0, 0.25, 0.5])
              return _lo(build([r.randint(-5, 5)] + [None if r.random() < p else r.randint(-5, 5) for _ in range(r.randint(0, 14))]))

          def _on_tree(f):  # cases hold level-order lists; build the tree just before the call
              return lambda vals, *a: f(build(vals), *a)

          def _show(vals, *a):
              return "(" + ", ".join([f"build({vals})"] + [repr(x) for x in a]) + ")"
          def _ref(t):  # iterative: carry the max of the values above each node
              total, stack = 0, [(t, t.val)]
              while stack:
                  n, top = stack.pop()
                  if n:
                      total += n.val >= top
                      stack += [(n.left, max(top, n.val)), (n.right, max(top, n.val))]
              return total
          def _gen(r):
              return (_rand_tree(r) or [r.randint(-5, 5)],)
          edge = [([5],), ([2, 2, 2],), ([-1, -2, -1],), ([3, 3, None, 4, 2],), ([1, None, 0, None, 2],)]
          against(lambda vals: good(build(vals), vals[0]), lambda vals: _ref(build(vals)), edge + rand_cases(_gen, 300),
                  name="good", show=lambda vals: f"(build({vals}), {vals[0]})")
      - id: c
        prompt: |
          - **Given** (see setup): `TreeNode` (`.val`, `.left`, `.right`) and `build(vals)`, which makes a tree from a level-order list (`None` = no node); `root = build([1, 2, 3, None, 5])` and `paths = []`.
          - **Write** `dfs(node, path)`, where `path` is the string for the nodes above (`""` at the root); at each leaf it appends the full path to `paths`. Then call `dfs(root, "")`.
          - **Result**: `paths` holds one `str` per root-to-leaf path, values joined by `"->"`, e.g. `"1->2->5"` (`"-1->-2"` with negatives); any order; nothing for an empty tree.
          - **Checked on**: `root` (`["1->2->5", "1->3"]`), then your `dfs` re-run with `paths` emptied on empty, one-node, one-child and 300 random trees.
        setup: |
          class TreeNode:
              def __init__(self, val=0, left=None, right=None):
                  self.val, self.left, self.right = val, left, right

          def build(vals):
              nodes = [None if v is None else TreeNode(v) for v in vals]
              kids = iter(nodes[1:])
              for node in nodes:
