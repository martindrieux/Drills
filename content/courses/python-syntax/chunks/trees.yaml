      - id: c
        prompt: |
          - **Given** (see setup): `TreeNode` (`.val`, `.left`, `.right`) and `build(vals)`, which makes a tree from a level-order list (`None` = no node).
          - **Write** `leaves(node)`, recursively (you need a second base case, for a leaf).
          - **Returns**: `int`, the number of leaves (nodes with no left **and** no right child); `0` for an empty tree.
          - **Checked on**: `build([1, 2, 3, 4, 5, None, 6])` (3), empty, one node (1), nodes with a single child, and 300 random trees.
        setup: |
          class TreeNode:
              def __init__(self, val=0, left=None, right=None):
                  self.val, self.left, self.right = val, left, right

          def build(vals):
              nodes = [None if v is None else TreeNode(v) for v in vals]
              kids = iter(nodes[1:])
              for node in nodes:
                  if node:
                      node.left, node.right = next(kids, None), next(kids, None)
              return nodes[0] if nodes else None
        solution: |
          def leaves(node):
              if not node:
                  return 0
              if not node.left and not node.right:
                  return 1
              return leaves(node.left) + leaves(node.right)
        check: |
          res = leaves(build([1, 2, 3, 4, 5, None, 6]))
          assert res == 3, f"leaves = {res!r}"
          assert leaves(None) == 0, f"leaves(None) = {leaves(None)!r}"
          from cardtest import against, rand_cases

          def _lo(root):  # tree -> its level-order list (what build() takes)
              out, q, i = [], [root], 0
              while i < len(q):
                  n = q[i]
                  i += 1
                  out.append(n.val if n else None)
                  if n:
                      q += [n.left, n.right]
              while out and out[-1] is None:
                  out.pop()
              return out

          def _grow(r, size):  # random shape with `size` nodes, values -5..5 (duplicates, negatives)
              if size == 0:
                  return None
              k = r.randint(0, size - 1)
