              kind = r.randrange(6)
              if kind == 0:
                  return r.choice([[], [r.randint(-5, 5)]])
              if kind == 1:
                  root = cur = TreeNode(r.randint(-5, 5))
                  bias = r.choice([0, 1, r.random()])
                  for _ in range(r.randint(1, 9)):
                      kid = TreeNode(r.randint(-5, 5))
                      if r.random() < bias:
                          cur.left = kid
                      else:
                          cur.right = kid
                      cur = kid
                  return _lo(root)
              if kind <= 3:
                  return _lo(_grow(r, r.randint(1, 14)))
              p = r.choice([0.0, 0.25, 0.5])
              return _lo(build([r.randint(-5, 5)] + [None if r.random() < p else r.randint(-5, 5) for _ in range(r.randint(0, 14))]))

          def _on_tree(f):  # cases hold level-order lists; build the tree just before the call
              return lambda vals, *a: f(build(vals), *a)

