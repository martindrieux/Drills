                      node.left, node.right = next(kids, None), next(kids, None)
              return nodes[0] if nodes else None

          root = build([1, 2, 3, None, 5])
          paths = []
        solution: |
          def dfs(node, path):
              if not node:
                  return
              path += str(node.val)
              if not node.left and not node.right:
                  paths.append(path)
              dfs(node.left, path + "->")
              dfs(node.right, path + "->")
