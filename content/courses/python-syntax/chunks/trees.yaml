                  setattr(n, r.choice(["left", "right"]), TreeNode(n.val))
              return _lo(t)
          def _gen_pair(r):  # identical copy, a copy with one change, or unrelated trees
              p = _rand_tree(r)
              k = r.randrange(4)
              q = list(p) if k == 0 else _mutate(r, p) if k <= 2 else _rand_tree(r)
              return (p, q) if r.random() < 0.5 else (q, p)
          edge = [([], []), ([1], []), ([1], [1]), ([1], [2]), ([1, 2], [1, None, 2]), ([1, 2, 1], [1, 1, 2]), ([1, 2, 3], [1, 2, 3]),
                  ([1, 2, None, 3], [1, 2, None, None, 3]), ([0], [0, 0])]
          against(lambda a, b: same(build(a), build(b)), lambda a, b: _lo(build(a)) == _lo(build(b)), edge + rand_cases(_gen_pair, 300),
                  name="same", show=lambda a, b: f"(build({a}), build({b}))")
      - id: c
        prompt: |
          - **Given** (see setup): `TreeNode` (`.val`, `.left`, `.right`) and `build(vals)`, which makes a tree from a level-order list (`None` = no node).
          - **Write** `mirror(a, b)`. **Returns** `bool`: `True` when `a` is the mirror image of `b` (equal root values, `a`'s left mirrors `b`'s right and `a`'s right mirrors `b`'s left); two empty trees → `True`. A tree `t` is symmetric when `mirror(t.left, t.right)`.
          - **Checked on**: `[1, 2, 2, 3, 4, 4, 3]` (symmetric), `[1, 2, 2, None, 3, None, 3]` (not), empty, a tree vs itself, and 300 random pairs (mirror copies, mirror copies with one change, unrelated).
        setup: |
          class TreeNode:
              def __init__(self, val=0, left=None, right=None):
                  self.val, self.left, self.right = val, left, right

          def build(vals):
              nodes = [None if v is None else TreeNode(v) for v in vals]
              kids = iter(nodes[1:])
              for node in nodes:
                  if node:
                      node.left, node.right = next(kids, None), next(kids, None)
              return nodes[0] if nodes else None
        solution: |
          def mirror(a, b):
              if not a or not b:
                  return a is b
              return a.val == b.val and mirror(a.left, b.right) and mirror(a.right, b.left)
        check: |
          t = build([1, 2, 2, 3, 4, 4, 3])
          assert mirror(t.left, t.right) is True, "[1, 2, 2, 3, 4, 4, 3] is symmetric"
          t = build([1, 2, 2, None, 3, None, 3])
          assert mirror(t.left, t.right) is False, "[1, 2, 2, None, 3, None, 3] is not symmetric"
          assert mirror(None, None) is True, f"mirror(None, None) = {mirror(None, None)!r}"
          from cardtest import against, rand_cases

          def _lo(root):  # tree -> its level-order list (what build() takes)
              out, q, i = [], [root], 0
              while i < len(q):
                  n = q[i]
                  i += 1
                  out.append(n.val if n else None)
                  if n:
                      q += [n.left, n.right]
              while out and out[-1] is None:
                  out.pop()
              return out

          def _grow(r, size):  # random shape with `size` nodes, values -5..5 (duplicates, negatives)
              if size == 0:
                  return None
              k = r.randint(0, size - 1)
              return TreeNode(r.randint(-5, 5), _grow(r, k), _grow(r, size - 1 - k))

          def _rand_tree(r):  # level-order list: empty, single, skewed / zigzag chain, random shapes, sparse lists
              kind = r.randrange(6)
              if kind == 0:
                  return r.choice([[], [r.randint(-5, 5)]])
              if kind == 1:
                  root = cur = TreeNode(r.randint(-5, 5))
                  bias = r.choice([0, 1, r.random()])
                  for _ in range(r.randint(1, 9)):
                      kid = TreeNode(r.randint(-5, 5))
                      if r.random() < bias:
                          cur.left = kid
                      else:
                          cur.right = kid
                      cur = kid
                  return _lo(root)
              if kind <= 3:
                  return _lo(_grow(r, r.randint(1, 14)))
              p = r.choice([0.0, 0.25, 0.5])
              return _lo(build([r.randint(-5, 5)] + [None if r.random() < p else r.randint(-5, 5) for _ in range(r.randint(0, 14))]))

          def _on_tree(f):  # cases hold level-order lists; build the tree just before the call
              return lambda vals, *a: f(build(vals), *a)

          def _show(vals, *a):
              return "(" + ", ".join([f"build({vals})"] + [repr(x) for x in a]) + ")"
          def _mir(n):  # mirrored copy, new nodes
              return TreeNode(n.val, _mir(n.right), _mir(n.left)) if n else None
          def _all(t):
              out, stack = [], [t]
              while stack:
                  n = stack.pop()
                  if n:
                      out.append(n)
                      stack += [n.left, n.right]
              return out
          def _mutate(r, vals):  # one small change: a value, swap two children, cut a subtree, or add / replace a child
              t = build(vals)
              if not t:
                  return [r.randint(-5, 5)]
              n = r.choice(_all(t))
              k = r.randrange(4)
              if k == 0:
                  n.val += r.choice([-1, 1])
              elif k == 1:
                  n.left, n.right = n.right, n.left
              elif k == 2:
                  setattr(n, r.choice(["left", "right"]), None)
              else:
                  setattr(n, r.choice(["left", "right"]), TreeNode(n.val))
              return _lo(t)
          def _gen(r):
              a = _rand_tree(r)
              k = r.randrange(4)
              b = _lo(_mir(build(a))) if k <= 1 else list(a) if k == 2 else _rand_tree(r)
              if k == 1:
                  b = _mutate(r, b)
              return (a, b) if r.random() < 0.5 else (b, a)
          edge = [([], []), ([1], []), ([1], [1]), ([1, 2], [1, None, 2]), ([1, 2], [1, 2]), ([2, 3, 4], [2, 4, 3]), ([2, 3, 4], [2, 3, 4]),
                  ([1, 2, 2], [1, 2, 2]), ([1, 2, None, 3], [1, None, 2, None, 3])]
          against(lambda a, b: mirror(build(a), build(b)), lambda a, b: _lo(build(a)) == _lo(_mir(build(b))), edge + rand_cases(_gen, 300),
                  name="mirror", show=lambda a, b: f"(build({a}), build({b}))")
