      # each node must fit between bounds set by ALL its ancestors, not just its parent
      def valid(node, lo=float('-inf'), hi=float('inf')):
          if not node:
              return True
          if not lo < node.val < hi:
              return False
          return valid(node.left, lo, node.val) and valid(node.right, node.val, hi)
      # search step: node = node.left if x < node.val else node.right
      # the inorder of a BST is sorted: k-th smallest = inorder[k - 1]
      ```
    cards:
      - id: a
        prompt: |
          - **Given** (see setup): `TreeNode` (`.val`, `.left`, `.right`) and `build(vals)`, which makes a tree from a level-order list (`None` = no node). A tree is a valid BST when every node is strictly greater than all values in its left subtree and strictly smaller than all values in its right subtree.
          - **Write** `valid(node, lo=float('-inf'), hi=float('inf'))`, called as `valid(root)`. **Returns** `bool`: whether the tree is a valid BST (empty: `True`; any duplicate: `False`).
          - **Write** `find(root, x)`, walking left or right (`root` is a valid BST). **Returns** the **node** (`TreeNode`, not its value) with `val == x`, or `None` if there is none.
          - **Write** `kth(root, k)` (`root` is a valid BST, `1 <= k <=` number of nodes). **Returns** `int`: the k-th smallest value (`k = 1` is the smallest).
          - **Checked on**: valid BSTs (incl. skewed), trees where a deep node fits its parent but breaks a farther ancestor's bound, duplicates, empty, missing `x`, every `k`, and 300 random cases each.
        setup: |
          class TreeNode:
              def __init__(self, val=0, left=None, right=None):
                  self.val, self.left, self.right = val, left, right

          def build(vals):
              nodes = [None if v is None else TreeNode(v) for v in vals]
              kids = iter(nodes[1:])
              for node in nodes:
                  if node:
                      node.left, node.right = next(kids, None), next(kids, None)
              return nodes[0] if nodes else None
        solution: |
          def valid(node, lo=float('-inf'), hi=float('inf')):
              if not node:
                  return True
              if not lo < node.val < hi:
                  return False
              return valid(node.left, lo, node.val) and valid(node.right, node.val, hi)

          def find(root, x):
              node = root
              while node and node.val != x:
                  node = node.left if x < node.val else node.right
              return node

          def kth(root, k):
              def inorder(n):
                  return inorder(n.left) + [n.val] + inorder(n.right) if n else []
              return inorder(root)[k - 1]
        check: |
          assert valid(build([2, 1, 3])) is True, "[2, 1, 3] is a valid BST"
          assert valid(build([5, 1, 4, None, None, 3, 6])) is False, "[5, 1, 4, ...] is not valid (4 < 5 on the right)"
          assert valid(build([5, 4, 6, None, None, 3, 7])) is False, "[5, 4, 6, None, None, 3, 7] is not valid (3 is right of 5): check bounds, not just children"
          assert valid(None) is True, f"valid(None) = {valid(None)!r}"
          t = build([8, 3, 10, 1, 6, None, 14])
          got = find(t, 6)
