id: trees
title: Binary tree idioms
intro: |
  Almost every tree problem is one of a handful of shapes: a recursive function that **returns** a value,
  one that **passes state down**, or a **level-by-level** BFS. Each card gives you `TreeNode` and
  `build(level_order_list)` (`None` = no node), so you only write the idiom.
problems:
  - Maximum Depth of Binary Tree
  - Invert Binary Tree
  - Same Tree
  - Binary Tree Level Order Traversal
  - Validate Binary Search Tree
  - Count Good Nodes in Binary Tree
atoms: [graph-dfs, graph-bfs, py-deque, py-stack]
skills:
  - id: trees.dfs-return
    name: recursive dfs that returns a value
    teach: |
      ```python
      def max_depth(node):
          if not node:             # handle None first
              return 0
          return 1 + max(max_depth(node.left), max_depth(node.right))   # combine the children
      ```
    cards:
      - id: a
        prompt: |
          - **Given** (see setup): `TreeNode` (`.val`, `.left`, `.right`) and `build(vals)`, which makes a tree from a level-order list (`None` = no node).
          - **Write** `max_depth(node)`, recursively.
          - **Returns**: `int`, the number of **nodes** on the longest root-to-leaf path; `0` for an empty tree (`node is None`).
          - **Checked on**: `build([3, 9, 20, None, None, 15, 7])` (3), empty, one node, one-sided chains, and 300 random trees.
        setup: |
          class TreeNode:
              def __init__(self, val=0, left=None, right=None):
                  self.val, self.left, self.right = val, left, right

          def build(vals):
              nodes = [None if v is None else TreeNode(v) for v in vals]
              kids = iter(nodes[1:])
              for node in nodes:
                  if node:
                      node.left, node.right = next(kids, None), next(kids, None)
              return nodes[0] if nodes else None
        solution: |
          def max_depth(node):
              if not node:
                  return 0
              return 1 + max(max_depth(node.left), max_depth(node.right))
        check: |
          res = max_depth(build([3, 9, 20, None, None, 15, 7]))
          assert res == 3, f"max_depth = {res!r}"
          assert max_depth(None) == 0, f"max_depth(None) = {max_depth(None)!r}"
          from cardtest import against, rand_cases

          def _lo(root):  # tree -> its level-order list (what build() takes)
              out, q, i = [], [root], 0
              while i < len(q):
                  n = q[i]
                  i += 1
                  out.append(n.val if n else None)
                  if n:
                      q += [n.left, n.right]
              while out and out[-1] is None:
                  out.pop()
              return out

          def _grow(r, size):  # random shape with `size` nodes, values -5..5 (duplicates, negatives)
              if size == 0:
                  return None
              k = r.randint(0, size - 1)
              return TreeNode(r.randint(-5, 5), _grow(r, k), _grow(r, size - 1 - k))

          def _rand_tree(r):  # level-order list: empty, single, skewed / zigzag chain, random shapes, sparse lists
              kind = r.randrange(6)
              if kind == 0:
                  return r.choice([[], [r.randint(-5, 5)]])
              if kind == 1:
                  root = cur = TreeNode(r.randint(-5, 5))
                  bias = r.choice([0, 1, r.random()])
                  for _ in range(r.randint(1, 9)):
                      kid = TreeNode(r.randint(-5, 5))
                      if r.random() < bias:
                          cur.left = kid
                      else:
                          cur.right = kid
                      cur = kid
                  return _lo(root)
              if kind <= 3:
                  return _lo(_grow(r, r.randint(1, 14)))
              p = r.choice([0.0, 0.25, 0.5])
              return _lo(build([r.randint(-5, 5)] + [None if r.random() < p else r.randint(-5, 5) for _ in range(r.randint(0, 14))]))

          def _on_tree(f):  # cases hold level-order lists; build the tree just before the call
              return lambda vals, *a: f(build(vals), *a)

          def _show(vals, *a):
              return "(" + ", ".join([f"build({vals})"] + [repr(x) for x in a]) + ")"
          def _ref(t):  # iterative: deepest (node, depth) pair
              best, stack = 0, [(t, 1)]
              while stack:
                  n, d = stack.pop()
                  if n:
                      best = max(best, d)
                      stack += [(n.left, d + 1), (n.right, d + 1)]
              return best
          edge = [([],), ([7],), ([1, 2],), ([1, None, 2],), ([1, 2, 3, 4, None, None, 5, 6],)]
          against(_on_tree(max_depth), _on_tree(_ref), edge + rand_cases(lambda r: (_rand_tree(r),), 300), name="max_depth", show=_show)
