id: loops
title: Loops & ranges
intro: |
  Most solutions are one or two loops. Know every `range` form, loop with index and value together,
  walk two lists side by side, and write the two-pointer `while` without thinking.
problems:
  - Two Sum II - Input Array Is Sorted
  - Valid Palindrome
  - Container With Most Water
  - 3Sum
  - Maximum Subarray
  - Best Time to Buy and Sell Stock
atoms: [py-iteration, py-lists]
skills:
  - id: loops.range
    name: range(start, stop, step)
    teach: |
      ```python
      # range(start=0, stop, step=1): start, start+step, ... up to but NEVER including stop
      list(range(2, 5))        # [2, 3, 4]
      list(range(0, 10, 3))    # [0, 3, 6, 9]
      list(range(3, -1, -1))   # [3, 2, 1, 0]  counting down: stop one past 0
      ```
      Pitfall: to include `b`, write `range(a, b + 1)`.
    cards:
      - id: a
        prompt: |
          **Given** (see setup): ints `a <= b`; `nums` a list.

          - **Set** `up`: list of the ints from `a` to `b` **inclusive**, ascending. Use `range`.
          - **Set** `evens`: list of the even numbers from 0 to 10 inclusive, ascending. Use `range` with a step.
          - **Set** `down`: list of the indices of `nums`, from the last index down to 0. Use `range`.
        setup: |
          a, b = 3, 6
          nums = [7, 8, 9]
        solution: |
          up = list(range(a, b + 1))
          evens = list(range(0, 11, 2))
          down = list(range(len(nums) - 1, -1, -1))
        check: |
          assert list(up) == [3, 4, 5, 6], f"up = {up!r}"
          assert list(evens) == [0, 2, 4, 6, 8, 10], f"evens = {evens!r}"
          assert list(down) == [2, 1, 0], f"down = {down!r}"
      - id: b
        prompt: |
          - **Set** `res`: list of the even numbers from 0 to 10 inclusive, ascending. Use `range` with a step.
        solution: |
          res = list(range(0, 11, 2))
        check: |
          assert res == [0, 2, 4, 6, 8, 10], f"res = {res!r}"
      - id: c
        prompt: |
          **Given** (see setup): `nums` a list; `out` an empty list.

          - **Modify** `out`: append the indices of `nums` one by one, from the **last** index down to 0, looping over a `range`.
        setup: |
          nums = [7, 8, 9]
          out = []
        solution: |
          for i in range(len(nums) - 1, -1, -1):
              out.append(i)
        check: |
          assert out == [2, 1, 0], f"out = {out!r}"

  - id: loops.enumerate
    name: enumerate for index + value
    teach: |
      ```python
      # enumerate(xs, start=0): yields (index, item) pairs
      for i, x in enumerate("ab"): ...            # (0, 'a'), (1, 'b')
      for i, x in enumerate("ab", start=1): ...   # (1, 'a'), (2, 'b')
      ```
    cards:
      - id: a
        prompt: |
          **Given** (see setup): `nums` a list of ints; `words` a list of strings; `out` and `pairs` empty lists.

          - **Modify** `out`: for each index `i` and value `x` of `nums` (with `enumerate`), append `i * x`.
          - **Modify** `pairs`: append one tuple `(number, word)` per word of `words`, in order, numbering from **1**.
        setup: |
          nums = [5, 6, 7]
          words = ["a", "b"]
          out = []
          pairs = []
        solution: |
          for i, x in enumerate(nums):
              out.append(i * x)
          for i, w in enumerate(words, start=1):
              pairs.append((i, w))
        check: |
          assert out == [0, 6, 14], f"out = {out!r}"
          assert pairs == [(1, "a"), (2, "b")], f"pairs = {pairs!r}"
      - id: b
        prompt: |
          **Given** (see setup): `words` a list of strings; `out` an empty list.

          - **Modify** `out`: append one tuple `(number, word)` per word of `words`, in order, numbering from **1** (with `enumerate`).
        setup: |
          words = ["a", "b", "c"]
          out = []
        solution: |
          for i, w in enumerate(words, start=1):
              out.append((i, w))
        check: |
          assert out == [(1, "a"), (2, "b"), (3, "c")], f"out = {out!r}"
      - id: c
        prompt: |
          **Given** (see setup): `s` a string.

          - **Set** `res`: list of ints, the indices of every `'a'` in `s`, ascending (with `enumerate`).
        setup: |
          s = "banana"
        solution: |
          res = [i for i, c in enumerate(s) if c == "a"]
        check: |
          assert res == [1, 3, 5], f"res = {res!r}"

  - id: loops.zip
    name: zip, adjacent pairs
    teach: |
      ```python
      # zip(a, b, ...): yields tuples of items side by side; stops at the SHORTEST
      list(zip([1, 2, 3], "ab"))      # [(1, 'a'), (2, 'b')]
      # adjacent pairs: zip a list with itself shifted by one
      a = [1, 4, 9]
      list(zip(a, a[1:]))             # [(1, 4), (4, 9)]
      # dict(zip(keys, values)) -> dict pairing them
      dict(zip("ab", [1, 2]))         # {'a': 1, 'b': 2}
      ```
    cards:
      - id: a
        prompt: |
          **Given** (see setup): `a` and `b` lists of ints (`b` is longer); `names` a list of strings, as long as `a`. Use `zip` for each item.

          - **Set** `res`: list, `res[i] = a[i] + b[i]`, stopping at the end of the shorter list.
          - **Set** `diffs`: list of `a[i+1] - a[i]` for each adjacent pair of `a` (`len(a) - 1` items).
          - **Set** `d`: dict mapping `names[i]` to `a[i]`.
        setup: |
          a = [1, 2, 4]
          b = [10, 20, 30, 40]
          names = ["x", "y", "z"]
        solution: |
          res = [x + y for x, y in zip(a, b)]
          diffs = [q - p for p, q in zip(a, a[1:])]
          d = dict(zip(names, a))
        check: |
          assert res == [11, 22, 34], f"res = {res!r}"
          assert diffs == [1, 2], f"diffs = {diffs!r}"
          assert d == {"x": 1, "y": 2, "z": 4}, f"d = {d!r}"
      - id: b
        prompt: |
          **Given** (see setup): `nums` a list of ints.

          - **Set** `res`: list of `nums[i+1] - nums[i]` for each adjacent pair (`len(nums) - 1` items), using `zip` on adjacent pairs.
        setup: |
          nums = [1, 4, 9, 16]
        solution: |
          res = [b - a for a, b in zip(nums, nums[1:])]
        check: |
          assert res == [3, 5, 7], f"res = {res!r}"
      - id: c
        prompt: |
          **Given** (see setup): `names` a list of strings; `scores` a list of ints with one extra value at the end.

          - **Set** `d`: dict mapping each name to the score at the same position (the extra score is ignored), in one call.
        setup: |
          names = ["ann", "bob"]
          scores = [90, 75, 60]
        solution: |
          d = dict(zip(names, scores))
        check: |
          assert d == {"ann": 90, "bob": 75}, f"d = {d!r}"

  - id: loops.two-pointers
    name: two pointers while loop
    teach: |
      ```python
      # two indices walk toward each other until they meet
      l, r = 0, len(nums) - 1
      while l < r:
          ...            # look at nums[l], nums[r]
          l += 1         # or r -= 1, or both
      ```
      Pitfall: every branch must move a pointer, or the loop never ends.
    cards:
      - id: a
        prompt: |
          **Given** (see setup): `nums` a list of ints.

          - **Modify** `nums` in place: reverse it with two pointers `l` and `r` (swap `nums[l]` and `nums[r]`, then move both).
        setup: |
          nums = [1, 2, 3, 4, 5]
        starter: |
          l, r = 0, len(nums) - 1
        solution: |
          l, r = 0, len(nums) - 1
          while l < r:
              nums[l], nums[r] = nums[r], nums[l]
              l += 1
              r -= 1
        check: |
          assert nums == [5, 4, 3, 2, 1], f"nums = {nums!r}"
      - id: b
        prompt: |
          **Given** (see setup): `nums` a list of ints sorted ascending; an int `target`; some pair adds up to `target`.

          - **Set** `res`: tuple `(l, r)` of indices with `l < r` and `nums[l] + nums[r] == target`, found by moving `l` (from the start) and `r` (from the end) toward each other.
        setup: |
          nums = [1, 3, 4, 6, 9]
          target = 10
        starter: |
          l, r = 0, len(nums) - 1
        solution: |
          l, r = 0, len(nums) - 1
          while nums[l] + nums[r] != target:
              if nums[l] + nums[r] < target:
                  l += 1
              else:
                  r -= 1
          res = (l, r)
        check: |
          assert res in [(0, 4), (2, 3)], f"res = {res!r}"
          assert nums[res[0]] + nums[res[1]] == target, f"res = {res!r}"
      - id: c
        prompt: |
          **Write** `is_pal(s)` with two pointers.

          - **Given**: `s` a string (may be empty).
          - **Returns**: bool, `True` if `s` reads the same backwards, else `False`.
          - **Checked on**: empty string, one character, even and odd lengths, a single mismatch at the ends or in the middle, plus random strings.
        solution: |
          def is_pal(s):
              l, r = 0, len(s) - 1
              while l < r:
                  if s[l] != s[r]:
                      return False
                  l += 1
                  r -= 1
              return True
        check: |
          from cardtest import against, rand_cases

          def _ref(s):
              return s == s[::-1]

          def _gen(r):
              half = [r.choice("ab") for _ in range(r.randint(0, 4))]
              s = half + [r.choice("abc")] * r.randint(0, 1) + half[::-1]
              if s and r.random() < 0.5:
                  s[r.randrange(len(s))] = r.choice("cd")
              return ("".join(s),)

          _edge = ["", "x", "aa", "ab", "aba", "abb", "abba", "abca", "abcba", "abcca", "xbcbz", "racecar"]
          against(is_pal, _ref, [(s,) for s in _edge] + rand_cases(_gen, 300))

  - id: loops.break-continue
    name: break, continue, for/else
    teach: |
      ```python
      # continue: skip to the next item; break: leave the loop now
      # for ... else: the else runs only if the loop did NOT break
      for x in [1, -2, 3]:
          if x < 0: continue      # skips -2
          if x == 5: break        # never happens
      else:
          print("no break")       # printed
      ```
    cards:
      - id: a
        prompt: |
          **Given** (see setup): `nums` a list of ints; `total = 0`; `lists` a list of lists of ints; `out` an empty list.

          - **Set** `total`: the sum of the numbers of `nums` that are not negative, skipping negatives with `continue`.
          - **Modify** `out`: for each list `xs` in `lists`, append its first number greater than 10 (stop with `break`), or `-1` if there is none (with `for/else`).
        setup: |
          nums = [3, -1, 4, -5, 2]
          total = 0
          lists = [[4, 12, 30], [3, 5]]
          out = []
        solution: |
          for x in nums:
              if x < 0:
                  continue
              total += x
          for xs in lists:
              for x in xs:
                  if x > 10:
                      out.append(x)
                      break
              else:
                  out.append(-1)
        check: |
          assert total == 9, f"total = {total!r}"
          assert out == [12, -1], f"out = {out!r}"
      - id: b
        prompt: |
          **Given** (see setup): `nums` a list of ints; at least one is greater than 10.

          - **Set** `res`: int, the first number of `nums` greater than `10`, stopping the loop with `break`.
        setup: |
          nums = [4, 12, 7, 30]
        solution: |
          for x in nums:
              if x > 10:
                  res = x
                  break
        check: |
          assert res == 12, f"res = {res!r}"
      - id: c
        prompt: |
          **Given** (see setup): `nums` a list of ints.

          - **Set** `res`: int, the first even number of `nums`, or `-1` if there is none. Use `for/else`.
        setup: |
          nums = [3, 5, 7]
        solution: |
          for x in nums:
              if x % 2 == 0:
                  res = x
                  break
          else:
              res = -1
        check: |
          assert res == -1, f"res = {res!r}"

  - id: loops.any-all
    name: any, all, sum(1 for ...)
    teach: |
      ```python
      # (f(x) for x in xs): generator expression, feeds a function without building a list
      # any(it) -> True if at least one item is true; all(it) -> True if every item is
      any(x < 0 for x in [1, -2])          # True
      all(x % 2 == 0 for x in [2, 3])      # False
      # sum(1 for x in xs if cond) -> number of matches
      sum(1 for x in [1, 5, 8] if x > 4)   # 2
      ```
      Edge case: `any([])` is `False`, `all([])` is `True`.
    cards:
      - id: a
        prompt: |
          **Given** (see setup): `nums` a list of ints; an int `k`. One line each.

          - **Set** `res`: bool, whether **any** number is negative.
          - **Set** `evens`: bool, whether **all** numbers are even.
          - **Set** `n`: int, how many numbers are greater than `k`.
        setup: |
          nums = [4, 2, -3, 8]
          k = 3
        solution: |
          res = any(x < 0 for x in nums)
          evens = all(x % 2 == 0 for x in nums)
          n = sum(1 for x in nums if x > k)
        check: |
          assert res is True, f"res = {res!r}"
          assert evens is False, f"evens = {evens!r}"
          assert n == 2, f"n = {n!r}"
      - id: b
        prompt: |
          **Given** (see setup): `nums` a list of ints.

          - **Set** `res`: bool, whether **all** numbers of `nums` are even, in one line.
        setup: |
          nums = [2, 4, 7, 8]
        solution: |
          res = all(x % 2 == 0 for x in nums)
        check: |
          assert res is False, f"res = {res!r}"
      - id: c
        prompt: |
          **Given** (see setup): `nums` a list of ints; an int `k`.

          - **Set** `res`: int, how many numbers of `nums` are greater than `k` (strictly), in one line.
        setup: |
          nums = [1, 5, 8, 3, 9]
          k = 4
        solution: |
          res = sum(1 for x in nums if x > k)
        check: |
          assert res == 3, f"res = {res!r}"
      - id: d
        prompt: |
          **Given** (see setup): `nums` a list of ints.

          - **Set** `res`: bool, whether `nums` is **strictly** increasing (each item `<` the next), in one line with `all` over adjacent pairs.
        setup: |
          nums = [1, 3, 3, 7]
        solution: |
          res = all(a < b for a, b in zip(nums, nums[1:]))
        check: |
          assert res is False, f"res = {res!r} (3 is followed by 3)"
