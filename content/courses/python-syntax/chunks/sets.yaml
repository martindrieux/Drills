id: sets
title: Sets
intro: |
  A set holds unique items with O(1) membership. Use it for "seen before?", deduplication,
  visited cells in a grid, and set algebra between two groups.
problems:
  - Contains Duplicate
  - Longest Consecutive Sequence
  - Valid Sudoku
  - Number of Islands
  - Longest Substring Without Repeating Characters
atoms: [py-sets]
skills:
  - id: sets.basics
    name: create, add, remove, test
    teach: |
      ```python
      # set(xs) -> set of the unique items of xs; set() is empty ({} is an empty DICT)
      s = set([1, 2, 2])   # {1, 2}
      # s.add(x): insert x
      s.add(3)             # {1, 2, 3}
      # s.remove(x): delete x (KeyError if missing); s.discard(x): same, never errors
      s.discard(9)         # no error, s unchanged
      # x in s -> bool in O(1) (O(n) on a list); len(s) -> size
      3 in s, len(s)       # (True, 3)
      ```
    cards:
      - id: a
        prompt: |
          **Given** (see setup): `nums` a list of ints with duplicates (it contains `1`, not `9`).

          - **Set** `e`: an empty set.
          - **Set** `s`: the set of the unique items of `nums`. Then on `s`: add `5`, remove `1` (it is there), remove `9` without error (it is not there).
          - **Set** `has`: bool, whether `2` is in `s`.
          - **Set** `n`: int, the size of `s`.
        setup: |
          nums = [1, 2, 2, 3]
        solution: |
          e = set()
          s = set(nums)
          s.add(5)
          s.remove(1)
          s.discard(9)
          has = 2 in s
          n = len(s)
        check: |
          assert isinstance(e, set) and len(e) == 0, f"e = {e!r}"
          assert isinstance(s, set) and s == {2, 3, 5}, f"s = {s!r}"
          assert has is True, f"has = {has!r}"
          assert n == 3, f"n = {n!r}"
      - id: b
        prompt: |
          **Given** (see setup): `s` a set of strings; `ks` a list of strings, some not in `s`.

          - **Modify** `s`: remove every item of `ks`, without an error for the ones that are missing.
        setup: |
          s = {"a", "b"}
          ks = ["b", "z"]
        solution: |
          for k in ks:
              s.discard(k)
        check: |
          assert s == {"a"}, f"s = {s!r}"
      - id: c
        prompt: |
          **Given** (see setup): `nums` and `banned` lists of ints.

          - **Set** `bad`: the set of the items of `banned`.
          - **Set** `res`: list of the items of `nums` not in `bad`, in their original order.
        setup: |
          nums = [1, 2, 3, 4]
          banned = [2, 4]
        solution: |
          bad = set(banned)
          res = [x for x in nums if x not in bad]
        check: |
          assert isinstance(bad, set), f"bad = {bad!r}"
          assert res == [1, 3], f"res = {res!r}"
      - id: d
        prompt: |
          **Given** (see setup): `s` a set of strings; `x` a string that is in `s`.

          - **Modify** `s`: remove `x` with the method that raises an error when the item is missing.
          - **Set** `n`: int, the number of items left in `s`.
        setup: |
          s = {"a", "b", "c"}
          x = "b"
        solution: |
          s.remove(x)
          n = len(s)
        check: |
          assert s == {"a", "c"}, f"s = {s!r}"
          assert n == 2, f"n = {n!r}"

  - id: sets.dedupe
    name: duplicates and dedupe
    teach: |
      ```python
      # a duplicate exists iff the set is smaller than the list
      nums = [3, 1, 3]
      len(set(nums)) != len(nums)    # True
      # seen-set: x already in seen means x is a repeat; otherwise seen.add(x)
      # list(dict.fromkeys(xs)) -> deduped list KEEPING first-seen order (set(xs) loses order)
      list(dict.fromkeys(nums))      # [3, 1]
      ```
    cards:
      - id: a
        prompt: |
          **Given** (see setup): `nums` a list of ints.

          - **Set** `res`: bool, whether `nums` contains a duplicate, in one line.
          - **Set** `first`: the first value seen again while scanning left to right, using a `seen` set.
          - **Set** `uniq`: list, `nums` without duplicates, **keeping** first-seen order.
        setup: |
          nums = [3, 1, 4, 1, 3]
        solution: |
          res = len(set(nums)) != len(nums)
          seen = set()
          for x in nums:
              if x in seen:
                  first = x
                  break
              seen.add(x)
          uniq = list(dict.fromkeys(nums))
        check: |
          assert res is True, f"res = {res!r}"
          assert first == 1, f"first = {first!r}"
          assert uniq == [3, 1, 4], f"uniq = {uniq!r}"
      - id: b
        prompt: |
          **Given** (see setup): `nums` a list of ints with at least one repeat.

          - **Set** `res`: the first value seen again while scanning `nums` left to right, using a `seen` set.
        setup: |
          nums = [3, 1, 4, 1, 5, 3]
        solution: |
          seen = set()
          for x in nums:
              if x in seen:
                  res = x
                  break
              seen.add(x)
        check: |
          assert res == 1, f"res = {res!r}"
      - id: c
        prompt: |
          **Given** (see setup): `nums` a list of ints.

          - **Set** `res`: list, `nums` without duplicates, **keeping** first-seen order.
        setup: |
          nums = [3, 1, 3, 2, 1]
        solution: |
          res = list(dict.fromkeys(nums))
        check: |
          assert res == [3, 1, 2], f"res = {res!r}"

  - id: sets.ops
    name: union, intersection, difference
    teach: |
      ```python
      a, b = {1, 2, 3}, {2, 3, 4}
      # a | b union; a & b intersection; a - b only in a; a ^ b in exactly one
      a | b, a & b, a - b, a ^ b   # ({1, 2, 3, 4}, {2, 3}, {1}, {1, 4})
      # a <= b -> bool: is a a subset of b?
      {2, 3} <= a                  # True
      # a.issubset(xs): same, but xs may be any iterable (operators need sets on both sides)
      {"a", "b"}.issubset("abc")   # True
      ```
    cards:
      - id: a
        prompt: |
          **Given** (see setup): sets `a` and `b`; strings `word` and `row`; `nums` a list of ints.

          - **Set** `res`: set of the items in both `a` and `b` (operator).
          - **Set** `every`: set of the items in either (operator).
          - **Set** `only_a`: set of the items in `a` but not in `b` (operator).
          - **Set** `one`: set of the items in exactly one of them (operator).
          - **Set** `sub`: bool, whether every letter of `word` is in `row` (operator).
          - **Set** `ok`: bool, whether `a` is a subset of the **list** `nums`, with a method (no conversion to a set).
        setup: |
          a, b = {1, 2, 3}, {2, 3, 4}
          word, row = "type", "qwertyuiop"
          nums = [3, 2, 1, 9]
        solution: |
          res = a & b
          every = a | b
          only_a = a - b
          one = a ^ b
          sub = set(word) <= set(row)
          ok = a.issubset(nums)
        check: |
          assert res == {2, 3}, f"res = {res!r}"
          assert every == {1, 2, 3, 4}, f"every = {every!r}"
          assert only_a == {1}, f"only_a = {only_a!r}"
          assert one == {1, 4}, f"one = {one!r}"
          assert sub is True, f"sub = {sub!r}"
          assert ok is True, f"ok = {ok!r}"
      - id: b
        prompt: |
          **Given** (see setup): sets `a` and `b`.

          - **Set** `only_a`: set of the items in `a` but not in `b`.
          - **Set** `one`: set of the items in exactly one of the two sets.
        setup: |
          a, b = {1, 2, 3}, {2, 3, 4}
        solution: |
          only_a = a - b
          one = a ^ b
        check: |
          assert only_a == {1}, f"only_a = {only_a!r}"
          assert one == {1, 4}, f"one = {one!r}"
      - id: c
        prompt: |
          **Given** (see setup): strings `word` and `row`.

          - **Set** `res`: bool, `True` if every letter of `word` is in `row`, else `False`.
        setup: |
          word, row = "type", "qwertyuiop"
        solution: |
          res = set(word) <= set(row)
        check: |
          assert res is True, f"res = {res!r}"
      - id: d
        prompt: |
          **Given** (see setup): sets `a` and `b`; `nums` a list of ints.

          - **Set** `both`: set of all items of `a` and `b`.
          - **Set** `ok`: bool, whether `a` is a subset of the **list** `nums`, with a method (no conversion to a set).
        setup: |
          a, b = {1, 2}, {2, 5}
          nums = [5, 2, 1, 9]
        solution: |
          both = a | b
          ok = a.issubset(nums)
        check: |
          assert both == {1, 2, 5}, f"both = {both!r}"
          assert ok is True, f"ok = {ok!r}"

  - id: sets.tuples
    name: sets of tuples (visited cells, pairs)
    teach: |
      ```python
      # tuples are hashable, so they can go in a set (a list or set inside raises TypeError)
      visited = {(0, 1)}
      (0, 1) in visited                          # True
      # frozenset(xs) -> hashable, unordered set: an undirected pair
      frozenset((1, 2)) == frozenset((2, 1))     # True
      ```
    cards:
      - id: a
        prompt: |
          **Given** (see setup): `visited` an empty set; `edges` a list of `(u, v)` tuples.

          - **Modify** `visited`: add the cells `(1, 2)` and `(0, 0)`.
          - **Set** `res`: bool, whether `(2, 1)` is in `visited`.
          - **Set** `n`: int, the number of distinct **undirected** edges in `edges` (`(1, 2)` and `(2, 1)` are the same edge).
        setup: |
          visited = set()
          edges = [(1, 2), (2, 1), (2, 3)]
        solution: |
          visited.add((1, 2))
          visited.add((0, 0))
          res = (2, 1) in visited
          n = len({frozenset(e) for e in edges})
        check: |
          assert visited == {(1, 2), (0, 0)}, f"visited = {visited!r}"
          assert res is False, f"res = {res!r}"
          assert n == 2, f"n = {n!r}"
      - id: b
        prompt: |
          **Given** (see setup): `g` a grid, a list of rows, each a list of `"#"` / `"."`.

          - **Set** `res`: set of the `(r, c)` tuples of the cells equal to `"#"`, in one line.
        setup: |
          g = [["#", "."], [".", "#"]]
        solution: |
          res = {(r, c) for r in range(len(g)) for c in range(len(g[0])) if g[r][c] == "#"}
        check: |
          assert res == {(0, 0), (1, 1)}, f"res = {res!r}"
      - id: c
        prompt: |
          **Given** (see setup): `edges` a list of `(u, v)` tuples.

          - **Set** `res`: int, the number of distinct **undirected** edges (`(1, 2)` and `(2, 1)` are the same edge).
        setup: |
          edges = [(1, 2), (2, 1), (2, 3)]
        solution: |
          res = len({frozenset(e) for e in edges})
        check: |
          assert res == 2, f"res = {res!r}"

  - id: sets.run-start
    name: start-of-run pattern
    teach: |
      ```python
      # Longest Consecutive Sequence in O(n): only count from numbers that START a run
      s = set(nums)
      for x in s:                   # loop over s, not nums (duplicates)
          if x - 1 not in s:        # x starts a run
              length = 1
              while x + length in s: length += 1
              best = max(best, length)
      ```
    cards:
      - id: a
        prompt: |
          **Write** `longest(nums)` in O(n) with the start-of-run pattern.

          - **Given**: `nums` a list of ints in any order (duplicates and negatives allowed, may be empty).
          - **Returns**: int, the length of the longest run of consecutive ints (`x, x+1, x+2, ...`) whose values all appear in `nums`; `0` for an empty list.
          - **Checked on**: empty list, one item, all items equal, duplicates inside a run, negatives, plus random lists.
        solution: |
          def longest(nums):
              s = set(nums)
              best = 0
              for x in s:
                  if x - 1 not in s:
                      length = 1
                      while x + length in s:
                          length += 1
                      best = max(best, length)
              return best
        check: |
          from cardtest import against, rand_cases

          def _ref(nums):
              best = 0
              for x in nums:
                  n = 0
                  while x + n in nums:
                      n += 1
                  best = max(best, n)
              return best

          def _gen(r):
              return ([r.randint(-6, 6) for _ in range(r.randint(0, 12))],)

          _edge = [[100, 4, 200, 1, 3, 2], [0, 3, 7, 2, 5, 8, 4, 6, 0, 1], [], [7], [7, 7, 7], [1, 2, 2, 3],
                   [-3, -1, -2, 5], [9, 1, 4, 7, 3, 2, 5, 8, 6, 0], [1, 3, 5], [5, 4, 3, 2, 1]]
          against(longest, _ref, [(a,) for a in _edge] + rand_cases(_gen, 300))
      - id: b
        prompt: |
          **Given** (see setup): `s` a set of ints; `x` in `s` starts a run (`x - 1` is not in `s`).

          - **Set** `res`: int, the length of the run `x, x+1, x+2, ...` in `s`, with a `while` loop.
        setup: |
          s = {1, 2, 3, 5}
          x = 1
        solution: |
          res = 1
          while x + res in s:
              res += 1
        check: |
          assert res == 3, f"res = {res!r}"
      - id: c
        prompt: |
          **Given** (see setup): `nums` a list of ints in any order, with duplicates.

          - **Set** `res`: int, the length of the longest run of consecutive ints whose values all appear in `nums`.
        setup: |
          nums = [0, 3, 7, 2, 5, 8, 4, 6, 0, 1]
        solution: |
          s = set(nums)
          res = 0
          for x in s:
              if x - 1 not in s:
                  length = 1
                  while x + length in s:
                      length += 1
                  res = max(res, length)
        check: |
          assert res == 9, f"res = {res!r}"
