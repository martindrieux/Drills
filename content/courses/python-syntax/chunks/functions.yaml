  - id: functions.memo-dict
    name: hand-written memo dict
    teach: |
      ```python
      # manual @cache: check the dict first, store before returning
      memo = {}
      def dp(i, j):
          if (i, j) in memo: return memo[(i, j)]
          memo[(i, j)] = ...      # compute
          return memo[(i, j)]
      ```
      Pitfall: a default argument `memo={}` is shared by every call; create `memo` in the outer function.
    cards:
      - id: a
        prompt: |
          - **Given**: the global dict `memo`, empty at the start (starter).
          - **Write** the memo lookup and store in `fib(n)`: if `n` is in `memo`, return `memo[n]`; otherwise compute it, store it in `memo[n]`, and return it (`fib(0) = 0`, `fib(1) = 1`; storing the base cases is optional).
          - **Returns**: `fib(n)`, an `int`.
          - **Checked on**: `fib(0..90)`, `n in memo` after `fib(n)`, and the number of calls to `fib` (about 2 per new `n`; without the lookup it explodes).
        starter: |
          memo = {}
          def fib(n):
              if n < 2:
                  return n
              # look in memo first, store the result before returning
              return fib(n - 1) + fib(n - 2)
        solution: |
          memo = {}
          def fib(n):
              if n < 2:
                  return n
              if n in memo:
                  return memo[n]
              memo[n] = fib(n - 1) + fib(n - 2)
              return memo[n]
        check: |
          _body, _calls = fib, [0]
          def fib(n):  # counting wrapper: the recursion inside the original goes through it
              _calls[0] += 1
              if _calls[0] > 3000:
                  raise AssertionError("fib(30) made more than 3000 calls: look in memo before computing, and store every result")
              return _body(n)
          try:
              memo.clear()
              got = fib(30)
          finally:
              fib = _body
          assert got == 832040, f"fib(30) = {got!r}"
          assert _calls[0] <= 62, f"fib(30) from an empty memo made {_calls[0]} calls (expected about 59: each n computed once)"
          assert 30 in memo and memo[30] == 832040, "memo[30] should hold fib(30) after the call"
          _f = [0, 1]
          for _ in range(89):
              _f.append(_f[-1] + _f[-2])
          memo.clear()
          for n in range(91):
              assert fib(n) == _f[n], f"fib({n}) = {fib(n)!r}, expected {_f[n]}"
              assert n < 2 or memo.get(n) == _f[n], f"after fib({n}), memo.get({n}) = {memo.get(n)!r}"
