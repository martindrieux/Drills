  - id: graphs.union-find
    name: union-find (disjoint set)
    teach: |
      ```python
      parent = list(range(n))        # nodes 1..n -> list(range(n + 1))
      def find(x):
          if parent[x] != x:
              parent[x] = find(parent[x])   # path compression
          return parent[x]

      def union(a, b):
          ra, rb = find(a), find(b)
          if ra == rb:
              return False           # already joined: this edge closes a cycle
          parent[ra] = rb
          return True
      ```
      Components = `n - (number of unions that returned True)`.
    cards:
      - id: a
        prompt: |
          - **Given**: `n: int`, nodes numbered **1..n**; `edges: list[list[int]]`, undirected `[a, b]` pairs (repeats and self-loops possible).
          - **Write** `analyze(n, edges)`; inside it create `parent` and write `find(x)` (with path compression) and `union(a, b)` (returns `False` when `a` and `b` are already joined).
          - **Returns**: a tuple `(components, first_cycle_edge)`: `int`, the number of connected components after all edges; and the first edge `[a, b]` (list or tuple) whose `union` returned `False`, or `None`.
          - **Checked on**: a triangle, two separate edges, a repeated edge, one node, a self-loop, and 300 random graphs.
        solution: |
          def analyze(n, edges):
              parent = list(range(n + 1))
              def find(x):
                  if parent[x] != x:
                      parent[x] = find(parent[x])
                  return parent[x]

              def union(a, b):
                  ra, rb = find(a), find(b)
                  if ra == rb:
                      return False
                  parent[ra] = rb
                  return True

              joined, cycle = 0, None
              for a, b in edges:
                  if union(a, b):
                      joined += 1
                  elif cycle is None:
                      cycle = [a, b]
              return n - joined, cycle
        check: |
          cases = [
              (3, [[1, 2], [1, 3], [2, 3]], (1, [2, 3])),
              (5, [[1, 2], [3, 4]], (3, None)),
              (5, [[1, 2], [2, 3], [1, 3], [4, 5], [5, 4]], (2, [1, 3])),
              (1, [], (1, None)),
          ]
          for n, edges, want in cases:
              got = analyze(n, edges)
              assert got == want, f"analyze({n}, {edges!r}) = {got!r}"
          from cardtest import against, rand_cases
          def _ref(n, edges):  # component labels: joining two components relabels one of them
              lab = list(range(n + 1))
              comps, cycle = n, None
              for a, b in edges:
                  if lab[a] == lab[b]:
                      if cycle is None:
                          cycle = [a, b]
                  else:
                      old = lab[a]
                      lab = [lab[b] if x == old else x for x in lab]
                      comps -= 1
              return comps, cycle
          def _same(got, want):  # the edge may come back as a list or a tuple
              try:
                  comps, e = got
              except (TypeError, ValueError):
                  return False
              return comps == want[0] and (e is None if want[1] is None else e is not None and list(e) == want[1])
          def _gen(r):
              n = r.randint(1, 9)
              edges = []
              for _ in range(r.randint(0, 2 * n)):
                  if n > 1 and r.random() > 0.05:
                      edges.append(r.sample(range(1, n + 1), 2))
                  else:
                      a = r.randint(1, n)
                      edges.append([a, a])  # rare self-loop
              return (n, edges)
          edge = [(2, [[1, 1]]), (2, [[2, 1], [1, 2]]), (4, [[1, 2], [3, 4], [2, 4], [1, 3]]), (4, [[4, 3], [3, 2], [2, 1]]), (6, [[5, 6]]),
                  (4, [[1, 2], [2, 3], [3, 4], [4, 1], [1, 3]])]
          against(analyze, _ref, edge + rand_cases(_gen, 300), same=_same)
      - id: b
        prompt: |
          - **Given** (see setup): `parent = list(range(5))` and `find(x)` (root of `x`, with path compression; reads the global `parent`).
          - **Write** `union(a, b)`: join the sets of `a` and `b` by linking one **root** to the other. **Returns** `False` if `a` and `b` were already in the same set, else `True`.
          - **Checked on**: `union(0, 1)`, `union(1, 2)`, `union(0, 2)`, `union(3, 4)` (`[True, True, False, True]`), then 300 random sequences of unions on a fresh `parent` (the return values and the resulting groups).
        setup: |
          parent = list(range(5))
          def find(x):
              if parent[x] != x:
                  parent[x] = find(parent[x])
              return parent[x]
        solution: |
          def union(a, b):
              ra, rb = find(a), find(b)
              if ra == rb:
                  return False
              parent[ra] = rb
              return True
        check: |
          got = [union(0, 1), union(1, 2), union(0, 2), union(3, 4)]
          assert got == [True, True, False, True], f"union results = {got!r}"
          assert find(0) == find(2) and find(3) != find(0), f"parent = {parent!r}"
          from cardtest import against, rand_cases
          def _run(n, pairs):  # fresh parent, your union on each pair; then a group id per node
              global parent
              parent = list(range(n))
              got = [union(a, b) for a, b in pairs]
              ids = {}
              return got, [ids.setdefault(find(i), len(ids)) for i in range(n)]
          def _ref(n, pairs):  # component labels, relabelled on each join
              lab, got = list(range(n)), []
              for a, b in pairs:
                  got.append(lab[a] != lab[b])
                  old = lab[a]
                  lab = [lab[b] if x == old else x for x in lab]
              ids = {}
              return got, [ids.setdefault(x, len(ids)) for x in lab]
          def _gen(r):
              n = r.randint(1, 8)
              return (n, [[r.randrange(n), r.randrange(n)] for _ in range(r.randint(0, 2 * n))])
          edge = [(1, [[0, 0]]), (3, [[0, 1], [1, 0]]), (4, [[0, 1], [2, 3], [1, 3], [0, 2]]), (4, [[3, 2], [2, 1], [1, 0], [0, 3]]),
                  (5, [[0, 1], [2, 1], [3, 4], [4, 0], [2, 3]])]
          against(_run, _ref, edge + rand_cases(_gen, 300), name="union",
