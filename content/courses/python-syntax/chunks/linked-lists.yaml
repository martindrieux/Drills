          edge = [([], []), ([], [4]), ([3], []), ([3, 2], [3, 1]), ([9, 5], [7]), ([1, 1], [1, 1]), ([7, 6, 5], [9]), ([0, -3], [9, -1, -3])]
          against(_mg, lambda x, y: sorted(x + y, reverse=True), edge + rand_cases(_gen, 300),
