      - id: c
        prompt: |
          - **Given**: `ListNode`, `build`, `to_list` (see setup); `a`, `b`: lists sorted in **non-increasing** order, each `ListNode | None`.
          - **Write** `merge_desc(a, b)` with a dummy + `tail`, relinking the existing nodes (no new `ListNode` except the dummy).
          - **Returns**: the head (`ListNode | None`) of the merged non-increasing list; `None` if both are empty.
          - **Checked on**: one or both empty, equal values across the lists, negatives, 300 random pairs; every result node must be an input node.
        setup: |
          class ListNode:
              def __init__(self, val=0, next=None):
                  self.val = val
                  self.next = next

          def build(vals):  # build([1, 2]) -> 1 -> 2
              head = None
              for v in reversed(vals):
                  head = ListNode(v, head)
