  - id: linked-lists.merge
    name: merge two sorted lists
    teach: |
      ```python
      dummy = tail = ListNode()
      while l1 and l2:               # take the smaller head each time
          if l1.val <= l2.val:
              tail.next, l1 = l1, l1.next
          else:
              tail.next, l2 = l2, l2.next
          tail = tail.next
      tail.next = l1 or l2       # the leftover list (or None)
      return dummy.next
      ```
    cards:
      - id: a
        prompt: |
          - **Given**: `ListNode`, `build`, `to_list` (see setup); `a`, `b`: lists sorted in non-decreasing order, each `ListNode | None`.
          - **Write** `merge(a, b)` with a dummy + `tail`, **relinking the existing nodes** (no new `ListNode` except the dummy).
          - **Returns**: the head (`ListNode | None`) of the merged non-decreasing list; `None` if both are empty.
          - **Checked on**: one or both empty, equal values across the lists, negatives, very different lengths, 300 random pairs; every result node must be an input node.
        setup: |
          class ListNode:
              def __init__(self, val=0, next=None):
                  self.val = val
                  self.next = next

          def build(vals):  # build([1, 2]) -> 1 -> 2
              head = None
              for v in reversed(vals):
                  head = ListNode(v, head)
              return head

          def to_list(head):  # 1 -> 2 -> [1, 2]
              out = []
              while head:
                  out.append(head.val)
                  head = head.next
              return out
        solution: |
          def merge(a, b):
              dummy = tail = ListNode()
              while a and b:
                  if a.val <= b.val:
                      tail.next, a = a, a.next
                  else:
                      tail.next, b = b, b.next
                  tail = tail.next
              tail.next = a or b
              return dummy.next
        check: |
          from cardtest import against, rand_cases

          def _nodes(head):  # every node from head, stopping on a cycle
              out = []
              while head is not None:
                  if len(out) > 100:
                      raise AssertionError("the returned list never ends: some .next points back to an earlier node (a cycle)")
                  out.append(head)
                  head = head.next
              return out
          def _fmt(vals):
              return " -> ".join(map(str, vals)) or "None"

          def _mg(x, y):
              na, nb = _nodes(build(x)), _nodes(build(y))
              got = _nodes(merge(na[0] if na else None, nb[0] if nb else None))
              ids = {id(n) for n in na + nb}
              if any(id(g) not in ids for g in got):
                  return "new nodes: relink the input nodes"
              return [g.val for g in got]
          def _gen(r):
              return (sorted(r.randint(-5, 5) for _ in range(r.randint(0, 8))),
                      sorted(r.randint(-5, 5) for _ in range(r.randint(0, 8))))
          edge = [([], []), ([], [4]), ([3], []), ([1, 4], [2, 5, 6]), ([1, 2], [1, 3]), ([1, 1], [1, 1]),
                  ([5, 6, 7], [1]), ([1], [5, 6, 7]), ([-3, 0], [-3, -1, 9])]
          against(_mg, lambda x, y: sorted(x + y), edge + rand_cases(_gen, 300),
                  show=lambda x, y: f"({_fmt(x)}, {_fmt(y)}))", name="to_list(merge")
      - id: b
        prompt: |
          - **Given**: `l1`, `l2`: two lists sorted in non-decreasing order (see setup, with `ListNode`, `build`, `to_list`).
          - **Set** `res`: the head of one sorted list made by relinking their nodes (dummy + tail).
          - **Checked on**: `to_list(res)` for the given lists.
        setup: |
          class ListNode:
              def __init__(self, val=0, next=None):
