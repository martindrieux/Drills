          def layer_norm_backward(dy, x, gamma, eps=1e-5):
              mu = x.mean(axis=-1, keepdims=True)
              s = np.sqrt(((x - mu) ** 2).mean(axis=-1, keepdims=True) + eps)
              xhat = (x - mu) / s
              lead = tuple(range(x.ndim - 1))
              dbeta = dy.sum(axis=lead)
              dgamma = (dy * xhat).sum(axis=lead)
              dxhat = dy * gamma
              dx = (dxhat - dxhat.mean(axis=-1, keepdims=True) - xhat * (dxhat * xhat).mean(axis=-1, keepdims=True)) / s
              return dx, dgamma, dbeta
