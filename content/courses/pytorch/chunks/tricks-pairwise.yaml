              return (data, centers)

          against(kmeans_step, _ref, _edge + rand_cases(_gen, 150), same=_same, show=_show)
      - id: b
        prompt: |
          Write `kmeans(data, init, max_iters, tol)`: full k-means (Lloyd's algorithm) from `init`, repeating assign-to-nearest-center + move-centers-to-means steps.
          - `data` `(N, D)` float: points; `init` `(K, D)` same dtype: initial centers; `max_iters` (int ≥ 0): maximum number of steps; `tol` (float): stop right after a step whose largest Euclidean center move is `< tol`
          - returns `(C, assign, sse)`: `C` `(K, D)`, dtype of `data`: final centers; `assign` `(N,)` int64: index of each point's nearest center in the **final** `C`; `sse` 0-dim float: `Σ_i ||data[i] - C[assign[i]]||²` (not square-rooted)
          - Each step: a center with no points keeps its position; ties -> lowest center index
          - A Python loop over iterations is fine; no `cdist`; don't modify `init`.

          <details><summary>Hint 1</summary>A vectorized step (assign + update) inside a thin loop over iterations.</details>
          <details><summary>Hint 2</summary>`shift = (new - C).norm(dim=1).max()`; after the loop, recompute `assign` from the final `C`.</details>
          <details><summary>Hint 3</summary>`sse = ((data - C[assign]) ** 2).sum()`.</details>
        setup: |
          import torch
        starter: |
          def kmeans(data, init, max_iters, tol):
              raise NotImplementedError
        solution: |
          def _assign(data, C):
              d = (C * C).sum(1)[None, :] - 2 * (data @ C.T)               # (N, K), ranking only
              return d.argmin(dim=1)                                        # (N,)

          def kmeans(data, init, max_iters, tol):
              C = init.clone()
              K = len(C)
              for _ in range(max_iters):
                  a = _assign(data, C)
                  sums = torch.zeros_like(C).index_add_(0, a, data)         # (K, D)
                  counts = torch.bincount(a, minlength=K)[:, None]          # (K, 1)
                  new = torch.where(counts > 0, sums / counts.clamp(min=1).to(C.dtype), C)
                  shift = (new - C).norm(dim=1).max()                       # largest center move
                  C = new
                  if shift < tol:
                      break
              assign = _assign(data, C)
              sse = ((data - C[assign]) ** 2).sum()                         # (N, D) -> scalar
              return C, assign, sse

          # Each iteration: O(NKD) GEMM + O(ND) scatter. Lloyd's never increases the SSE -> converges to a local
          #   minimum that depends on init (run several inits).
          # NumPy: np.add.at / np.bincount / np.where; sklearn.cluster.KMeans(init=..., n_init=1).
          # Mistakes: the stale assignment of the last step; shift as a sum or mean; sqrt in sse.
          # Follow-up: choosing K (elbow on sse); mini-batch k-means.
        check: |
          import dis
          import torch
          from cardtest import against, rand_cases

          _names, _todo = set(), [kmeans.__code__]
          while _todo:
              _c = _todo.pop()
              _names |= set(_c.co_names)
              _todo += [k for k in _c.co_consts if hasattr(k, "co_code")]
          assert "cdist" not in _names, "don't use torch.cdist"

          def _step(X, C):
              assign = []
              for x in X:
                  ds = [sum((a - b) ** 2 for a, b in zip(x, c)) for c in C]
                  assign.append(ds.index(min(ds)))
              new = []
              for k, c in enumerate(C):
                  pts = [x for x, a in zip(X, assign) if a == k]
                  new.append([sum(col) / len(pts) for col in zip(*pts)] if pts else c)
              return new, assign

          def _ref(data, init, max_iters, tol):
              X, C = data.double().tolist(), init.double().tolist()
              for _ in range(max_iters):
                  new, _a = _step(X, C)
                  shift = max(sum((a - b) ** 2 for a, b in zip(u, v)) ** 0.5 for u, v in zip(new, C))
                  C = new
                  if shift < tol:
                      break
              _, assign = _step(X, C)
              sse = sum(sum((a - b) ** 2 for a, b in zip(x, C[k])) for x, k in zip(X, assign))
              return (torch.tensor(C, dtype=data.dtype).reshape(init.shape), torch.tensor(assign, dtype=torch.long),
                      torch.tensor(sse, dtype=torch.float64))

          def _same(got, exp):
              if not (isinstance(got, tuple) and len(got) == 3):
                  return False
              c, a, s = got
              return (isinstance(c, torch.Tensor) and c.shape == exp[0].shape and c.dtype == exp[0].dtype
                      and isinstance(a, torch.Tensor) and a.dtype == torch.int64 and torch.equal(a, exp[1])
                      and torch.allclose(c, exp[0], rtol=1e-5, atol=1e-5)
                      and isinstance(s, torch.Tensor) and s.dim() == 0
                      and torch.allclose(s.double(), exp[2], rtol=1e-5, atol=1e-5))

          def _show(data, init, max_iters, tol):
              return f"(data {tuple(data.shape)}, init {tuple(init.shape)}, max_iters={max_iters}, tol={tol})"

          def _t(rows):
              return torch.tensor(rows, dtype=torch.float64)

          _I0 = _t([[0., 0.], [5., 5.]])
          _orig = _I0.clone()
          kmeans(_t([[0., 1.], [1., 0.], [6., 5.]]), _I0, 3, 0.0)
          assert torch.equal(_I0, _orig), "kmeans modified `init` in place"

          g = torch.Generator().manual_seed(0)
          _blobs = torch.cat([torch.randn(15, 2, generator=g, dtype=torch.float64) * 0.6 + c
                              for c in (_t([0., 0.]), _t([4., 0.]), _t([0., 4.]))])
          _bad = _t([[0., 0.], [0.5, 0.], [0., 0.5]])
