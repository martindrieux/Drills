  - id: tricks-pairwise.nt-xent
    name: Contrastive loss on one batch, NT-Xent (Hard)
    teach: |
      Batch `z` `(N, D)`, `N` even: rows `2i`, `2i+1` are a positive pair, every other row is a negative.
      With `s[i, j] = cos(z[i], z[j]) / τ`, anchor `i` costs `-log( exp(s[i, p(i)]) / Σ_{j ≠ i} exp(s[i, j]) )`; return the mean over the `N` anchors.

      ```python
      # N = 4 -> partners p = [1, 0, 3, 2]; row 0's denominator sums columns 1, 2, 3 (never itself)
      ```
      Supervised variant: `labels` `(N,)`; every `j ≠ i` with the same label is a positive.
      Constraints: no loops, scale-invariant, stable for `τ = 0.01` in float32.
    cards:
      - id: a
        prompt: |
          Write `nt_xent(z, temperature)`: the SimCLR contrastive loss of a batch where rows `2i` and `2i+1` are a positive pair and every other row is a negative.
          - `z` `(N, D)` float, `N` even: embeddings (any scale); `temperature` (float > 0, may be 0.01)
          - returns `loss` 0-dim, dtype of `z`: with `s[i, j] = cos(z[i], z[j]) / temperature` and `p(i)` the partner of `i`, `loss = mean_i -log( exp(s[i, p(i)]) / Σ_{j ≠ i} exp(s[i, j]) )`; finite even at `temperature = 0.01` in float32
          - No Python loops.

          <details><summary>Hint 1</summary>Per row, a classification: pick the partner among the `N - 1` other rows.</details>
          <details><summary>Hint 2</summary>Normalize rows, one matmul, diagonal -> `-inf`, then a stable log-softmax; the partner of `i` is `i ^ 1`.</details>
          <details><summary>Hint 3</summary>`F.cross_entropy(s.masked_fill(eye, float("-inf")), torch.arange(N) ^ 1)`.</details>
        setup: |
          import torch
          import torch.nn.functional as F
        starter: |
          def nt_xent(z, temperature):
              raise NotImplementedError
        solution: |
          def nt_xent(z, temperature):
              N = len(z)
              u = F.normalize(z, dim=1)                                     # (N, D), unit rows
              s = u @ u.T / temperature                                     # (N, N) cosine / τ
              s = s.masked_fill(torch.eye(N, dtype=torch.bool), float("-inf"))   # drop j == i
              target = torch.arange(N) ^ 1                                  # (N,) partners 1, 0, 3, 2, ...
              return F.cross_entropy(s, target)                             # mean of -log_softmax[i, p(i)]

          # Trick: a cross-entropy over the other N - 1 rows; the -inf diagonal removes exp(1/τ) (the largest term).
          #   cross_entropy uses logsumexp, so 1/τ = 100 does not overflow (exp(100) > float32 max).
          # O(N² D) time, O(N²) memory. Pairs (i, i + N/2) instead: target = (arange(N) + N // 2) % N.
          # NumPy: np.fill_diagonal(s, -np.inf), then s - logsumexp by hand with a max-shift.
          # Mistakes: masking with 0 instead of -inf; forgetting to normalize.
          # Follow-up: learnable temperature (CLIP's logit_scale).
        check: |
          import dis
          import math
          import torch
          from cardtest import against, rand_cases

          _names, _loops, _todo = set(), False, [nt_xent.__code__]
          while _todo:
              _c = _todo.pop()
              _loops |= any(i.opname.startswith(("FOR_ITER", "JUMP_BACKWARD")) for i in dis.get_instructions(_c))
              _todo += [k for k in _c.co_consts if hasattr(k, "co_code")]
          assert not _loops, "no Python loops (for / while / comprehensions)"

          def _ref(z, t):
              Z = z.double().tolist()
              U = [[v / math.sqrt(sum(w * w for w in r)) for v in r] for r in Z]
              N, tot = len(U), 0.0
              for i in range(N):
                  s = [sum(a * b for a, b in zip(U[i], U[j])) / t for j in range(N)]
                  others = [s[j] for j in range(N) if j != i]
                  m = max(others)
                  lse = m + math.log(sum(math.exp(v - m) for v in others))
                  tot += lse - s[i ^ 1]
              return (torch.tensor(tot / N, dtype=torch.float64), z.dtype)

          def _same(got, exp):
              return (isinstance(got, torch.Tensor) and got.dim() == 0 and got.dtype == exp[1]
                      and bool(torch.isfinite(got)) and math.isclose(got.item(), exp[0].item(), rel_tol=1e-4, abs_tol=1e-4))

          def _show(z, t):
              return f"(z {tuple(z.shape)} {str(z.dtype)[6:]}{'' if z.is_contiguous() else ' non-contiguous'}, temperature={t})"

          g = torch.Generator().manual_seed(0)
          _z = torch.randn(8, 5, generator=g)
          _edge = [
              (torch.tensor([[1., 0.], [0., 1.]], dtype=torch.float64), 1.0),
              (torch.tensor([[1., 2.], [1., 2.], [1., 2.], [1., 2.]]), 0.5),
              (5 * _z, 0.1),
              (_z, 0.01),
              (_z[[0, 0, 1, 1, 2, 2]] + 0.01 * torch.randn(6, 5, generator=g), 0.01),
              (torch.randn(5, 6, generator=g).T, 0.2),
              (torch.randn(10, 3, generator=g, dtype=torch.float64), 0.07),
          ]

          def _gen(r):
              gg = torch.Generator().manual_seed(r.randint(0, 10**9))
              n, d = 2 * r.randint(1, 10), r.randint(1, 8)
              dt = r.choice([torch.float32, torch.float64])
              base = torch.randn(n // 2, d, generator=gg, dtype=dt)
              z = base.repeat_interleave(2, dim=0) + r.choice([0.1, 1.0]) * torch.randn(n, d, generator=gg, dtype=dt)
              z = z * r.choice([0.5, 1, 30])
              if r.random() < 0.3:
                  z = z.T.contiguous().T
              return (z, r.choice([0.01, 0.07, 0.1, 0.5, 1.0]))

          against(nt_xent, _ref, _edge + rand_cases(_gen, 150), same=_same, show=_show)
      - id: b
        prompt: |
          Write `supcon(z, labels, temperature)`: the supervised contrastive loss, where every other row with the same label is a positive of anchor `i`.
          - `z` `(N, D)` float: embeddings (any scale); `labels` `(N,)` int64: class of each row; `temperature` (float > 0, may be 0.01)
          - returns `loss` 0-dim, dtype of `z`: with `s[i, j] = cos(z[i], z[j]) / temperature`, `P(i) = {j ≠ i : labels[j] == labels[i]}` and `log_p[i, j] = s[i, j] - log Σ_{k ≠ i} exp(s[i, k])`, `loss` = mean over anchors with `P(i)` non-empty of `-mean_{j ∈ P(i)} log_p[i, j]`; `0.` if no anchor has a positive
          - Never NaN or inf; no Python loops.

          <details><summary>Hint 1</summary>Same masked log-softmax; only which entries are averaged changes -> a boolean positives mask.</details>
          <details><summary>Hint 2</summary>`pos = (labels[:, None] == labels[None, :]) & ~eye`; `-inf * 0` is NaN, so use `masked_fill`, not a product.</details>
          <details><summary>Hint 3</summary>`-(log_p.masked_fill(~pos, 0).sum(1)) / n_pos.clamp(min=1)`, averaged over `n_pos > 0`.</details>
        setup: |
          import torch
          import torch.nn.functional as F
        starter: |
          def supcon(z, labels, temperature):
              raise NotImplementedError
        solution: |
          def supcon(z, labels, temperature):
              N = len(z)
              u = F.normalize(z, dim=1)
              eye = torch.eye(N, dtype=torch.bool)
              s = (u @ u.T / temperature).masked_fill(eye, float("-inf"))   # (N, N), self removed
              log_p = s.log_softmax(dim=1)                                  # (N, N), diagonal -inf
              pos = (labels[:, None] == labels[None, :]) & ~eye             # (N, N) bool positives
              n_pos = pos.sum(dim=1)                                        # (N,)
              per = -log_p.masked_fill(~pos, 0).sum(dim=1) / n_pos.clamp(min=1)   # (N,)
              has = n_pos > 0
              return per[has].mean() if bool(has.any()) else z.new_zeros(())

          # Trick: one masked log_softmax, then a mask-weighted row mean; the positives mask is a broadcast label compare.
          # NaN trap: log_p is -inf on the diagonal; log_p * pos gives -inf * 0 = NaN -> masked_fill / where.
          # Anchors without positives are skipped (0 / 0); the mean of an empty tensor is NaN.
          # NumPy: np.where(pos, log_p, 0).sum(1); log_softmax by hand with a max-shift.
          # Mistakes: forgetting ~eye (the anchor counts itself); F.cross_entropy takes one target per row.
          # Follow-up: SupCon "in" variant (log of the mean of probabilities).
        check: |
          import dis
          import math
          import torch
          from cardtest import against, rand_cases

          _loops, _todo = False, [supcon.__code__]
          while _todo:
              _c = _todo.pop()
              _loops |= any(i.opname.startswith(("FOR_ITER", "JUMP_BACKWARD")) for i in dis.get_instructions(_c))
              _todo += [k for k in _c.co_consts if hasattr(k, "co_code")]
          assert not _loops, "no Python loops (for / while / comprehensions)"

          def _ref(z, labels, t):
              Z, L = z.double().tolist(), labels.tolist()
              U = [[v / math.sqrt(sum(w * w for w in r)) for v in r] for r in Z]
              N, tot, cnt = len(U), 0.0, 0
              for i in range(N):
                  P = [j for j in range(N) if j != i and L[j] == L[i]]
                  if not P:
                      continue
                  s = [sum(a * b for a, b in zip(U[i], U[j])) / t for j in range(N)]
                  others = [s[j] for j in range(N) if j != i]
                  m = max(others)
                  lse = m + math.log(sum(math.exp(v - m) for v in others))
                  tot += sum(lse - s[j] for j in P) / len(P)
                  cnt += 1
              return (torch.tensor(tot / cnt if cnt else 0.0, dtype=torch.float64), z.dtype)

          def _same(got, exp):
              return (isinstance(got, torch.Tensor) and got.dim() == 0 and got.dtype == exp[1]
                      and bool(torch.isfinite(got)) and math.isclose(got.item(), exp[0].item(), rel_tol=1e-4, abs_tol=1e-4))

          def _show(z, labels, t):
              return f"(z {tuple(z.shape)} {str(z.dtype)[6:]}, labels={labels.tolist()}, temperature={t})"

          g = torch.Generator().manual_seed(0)
          _z = torch.randn(6, 4, generator=g)
          _L = lambda *v: torch.tensor(v, dtype=torch.long)
          _edge = [
              (_z, _L(0, 0, 1, 1, 2, 2), 0.5),
              (_z, _L(0, 0, 1, 1, 1, 2), 0.1),
              (_z, _L(3, 3, 3, 3, 3, 3), 0.2),
              (_z, _L(0, 1, 2, 3, 4, 5), 0.2),
              (_z[:1], _L(0), 1.0),
              (_z, _L(0, 1, 0, 1, 0, 2), 0.01),
              (4 * _z.double(), _L(5, 5, 7, 7, 7, 9), 0.07),
              (_z[[0, 0, 0, 1]], _L(0, 0, 1, 1), 0.5),
          ]

          def _gen(r):
              gg = torch.Generator().manual_seed(r.randint(0, 10**9))
              n, d, c = r.randint(1, 16), r.randint(1, 6), r.randint(1, 6)
              dt = r.choice([torch.float32, torch.float64])
              labels = torch.randint(0, c, (n,), generator=gg)
              z = torch.randn(c, d, generator=gg, dtype=dt)[labels] + r.choice([0.3, 1.0]) * torch.randn(n, d, generator=gg, dtype=dt)
              return (z * r.choice([0.5, 1, 20]), labels, r.choice([0.01, 0.07, 0.1, 0.5, 1.0]))

          against(supcon, _ref, _edge + rand_cases(_gen, 150), same=_same, show=_show)
