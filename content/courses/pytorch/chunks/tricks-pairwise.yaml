              (_blobs, _bad, 0, 1e-6),
              (_blobs, _bad, 1, 0.0),
              (_blobs, _bad, 2, 0.0),
              (_blobs, _bad, 100, 1e9),
              (_blobs, _bad, 100, 1e-8),
              (_blobs[:2], torch.cat([_blobs[:2], _t([[30., 30.]])]), 10, 1e-6),
              (_blobs[:1], _t([[1., 1.], [-1., -1.]]), 3, 0.0),
              (_blobs, torch.cat([_bad, _t([[50., -50.]])]), 50, 1e-6),
