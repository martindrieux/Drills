      - id: b
        prompt: |
          Write `pack_tokens(h, mask)`, which drops padding: keep only the real tokens of a batch and where each came from.
          - `h` (B, T, D): token vectors; `mask` (B, T) bool: True = real token
          - returns `(vals, pos)`: `vals` (n, D): the real `h[b, t]`, row-major (by `b`, then `t`); `pos` (n, 2) int64: their `(b, t)`
          - no Python loops
        setup: |
          import torch
        starter: |
          def pack_tokens(h, mask):
              raise NotImplementedError
        solution: |
          def pack_tokens(h, mask):
              return h[mask], mask.nonzero()      # (n, D), (n, 2)
        check: |
          import dis
          from cardtest import against, rand_cases

          def _has_loop(fn):
              def walk(co):
                  if any(i.opname in ("FOR_ITER", "JUMP_BACKWARD", "JUMP_BACKWARD_NO_INTERRUPT") for i in dis.get_instructions(co)):
                      return True
                  return any(walk(c) for c in co.co_consts if hasattr(c, "co_code"))
              return walk(fn.__code__)

          assert not _has_loop(pack_tokens), "pack_tokens contains a Python loop (for / while / comprehension): index with the mask"

          def _ref(h, mask):
              B, T, D = h.shape
              vals, pos = [], []
              for b in range(B):
                  for t in range(T):
                      if mask[b, t]:
                          vals.append(h[b, t])
                          pos.append([b, t])
              v = torch.stack(vals) if vals else torch.zeros(0, D, dtype=h.dtype)
              return v, torch.tensor(pos, dtype=torch.long).reshape(-1, 2)

          def _same(got, exp):
              if not (isinstance(got, tuple) and len(got) == 2 and all(torch.is_tensor(g) for g in got)):
                  return False
              return all(g.shape == e.shape and g.dtype == e.dtype and torch.equal(g, e) for g, e in zip(got, exp))

          def _show(h, mask):
              return f"(h {tuple(h.shape)}, mask {mask.int().tolist()})"

          def _gen(r):
              g = torch.Generator().manual_seed(r.randrange(2**31))
              B, T, D = r.randint(1, 4), r.randint(1, 5), r.randint(1, 3)
              return (torch.randn(B, T, D, generator=g), torch.rand(B, T, generator=g) < r.random())

          _h = torch.arange(12.0).view(2, 3, 2)
          cases = [
              (_h, torch.zeros(2, 3, dtype=torch.bool)),                       # n = 0
              (_h, torch.ones(2, 3, dtype=torch.bool)),                        # all real
              (_h, torch.tensor([[True, True, False], [True, False, False]])),
              (_h[:1], torch.tensor([[False, False, True]])),                  # B = 1
              (_h[:, :1], torch.tensor([[False], [True]])),                    # T = 1
          ]
          against(pack_tokens, _ref, cases + rand_cases(_gen, 200), same=_same, show=_show)

  - id: idx-fancy.assign
    name: "Writing through indices: x[idx] = v, index_add_, index_put_(accumulate=True)"
    teach: |
      ```python
      # x[idx] = v: writes v in place at idx
      x = torch.zeros(3); x[torch.tensor([0, 2])] = 7.                                       # [7, 0, 7]
      # x.index_add_(dim, idx (K,), src (size K on dim)) -> x: x[idx[k]] += src[k], repeats add up
      torch.zeros(3).index_add_(0, torch.tensor([1, 1, 2]), torch.tensor([1., 1., 5.]))     # (3,): [0, 2, 5]
      # x.index_put_((rows, cols), vals, accumulate=True) -> x: x[rows[k], cols[k]] += vals[k], repeats add up
      torch.zeros(2, 2).index_put_((torch.tensor([0, 0]), torch.tensor([1, 1])), torch.tensor([1., 2.]), accumulate=True)
      #                                                                                       (2, 2): [[0, 3], [0, 0]]
      ```
      Pitfall: `x[idx] += v` adds a repeated index only once.
    cards:
      - id: a
        prompt: |
          Write values into tensors through index tensors.
          - `a` (6,) float: zeros, with `-1.` at the positions in `pos`
          - `cnt` (5,) float: `cnt[c]` = number of times `c` appears in `labels`, with `index_add_`
          - `M` (3, 3) float: zeros, plus `vals[k]` added at cell `(rows[k], cols[k])` for every `k` (repeated cells add up), with `index_put_`
        setup: |
          import torch
          C = 5
          pos = torch.tensor([1, 4])
          labels = torch.tensor([2, 0, 2, 2, 4])
          rows = torch.tensor([0, 2, 0])
          cols = torch.tensor([1, 1, 1])
          vals = torch.tensor([1., 2., 3.])
        solution: |
          a = torch.zeros(6)
          a[pos] = -1.
          cnt = torch.zeros(C).index_add_(0, labels, torch.ones(5))
          M = torch.zeros(3, 3).index_put_((rows, cols), vals, accumulate=True)
        check: |
          def _chk(name, got, exp):
              assert torch.is_tensor(got), f"{name} is a {type(got).__name__}, expected a tensor"
              assert got.shape == exp.shape, f"{name}.shape = {tuple(got.shape)}, expected {tuple(exp.shape)}"
              assert got.dtype == exp.dtype, f"{name}.dtype = {got.dtype}, expected {exp.dtype}"
              assert torch.equal(got, exp), f"{name} = {got.tolist()}, expected {exp.tolist()}"

          _chk("a", a, torch.tensor([0., -1., 0., 0., -1., 0.]))
          _chk("cnt", cnt, torch.tensor([1., 0., 3., 0., 1.]))
          _chk("M", M, torch.tensor([[0., 4., 0.], [0., 0., 0.], [0., 2., 0.]]))
      - id: b
        prompt: |
          Write `adjacency(src, dst, w, N)`: the weighted adjacency matrix of a directed graph whose edges may repeat.
          - `src`, `dst` (E,) int64 in `[0, N)`: edge `e` goes from `src[e]` to `dst[e]`; `w` (E,) float: edge weights; `N` (int): number of nodes; `E` may be 0
          - returns `adj` (N, N), dtype of `w`: `adj[s, d]` = sum of `w[e]` over the edges `s -> d`, 0 if none
          - no Python loops
        setup: |
          import torch
        starter: |
          def adjacency(src, dst, w, N):
              raise NotImplementedError
        solution: |
          def adjacency(src, dst, w, N):
              adj = torch.zeros(N, N, dtype=w.dtype)
              return adj.index_put_((src, dst), w, accumulate=True)     # adj[src[e], dst[e]] += w[e]
        check: |
          import dis
          from cardtest import against, rand_cases

          def _has_loop(fn):
              def walk(co):
                  if any(i.opname in ("FOR_ITER", "JUMP_BACKWARD", "JUMP_BACKWARD_NO_INTERRUPT") for i in dis.get_instructions(co)):
                      return True
                  return any(walk(c) for c in co.co_consts if hasattr(c, "co_code"))
              return walk(fn.__code__)

          assert not _has_loop(adjacency), "adjacency contains a Python loop (for / while / comprehension): accumulate with index_put_"

          def _ref(src, dst, w, N):
              adj = torch.zeros(N, N, dtype=w.dtype)
              for e in range(len(w)):
                  adj[int(src[e]), int(dst[e])] += w[e]
              return adj

          def _same(got, exp):
              return (torch.is_tensor(got) and got.shape == exp.shape and got.dtype == exp.dtype
                      and torch.allclose(got, exp, atol=1e-5))

          def _show(src, dst, w, N):
              return f"(src {src.tolist()}, dst {dst.tolist()}, w {w.tolist()} {w.dtype}, N={N})"

          def _gen(r):
              g = torch.Generator().manual_seed(r.randrange(2**31))
              N, E = r.randint(1, 4), r.randint(0, 8)
              dt = r.choice([torch.float32, torch.float64])
              return (torch.randint(0, N, (E,), generator=g), torch.randint(0, N, (E,), generator=g),
                      torch.randn(E, generator=g, dtype=dt), N)

          _e = torch.zeros(0, dtype=torch.long)
          cases = [
              (_e, _e, torch.zeros(0), 3),                                                      # no edge
              (torch.tensor([0, 0]), torch.tensor([0, 0]), torch.tensor([1.5, 2.0]), 1),        # N = 1, duplicate self-loop
              (torch.tensor([0]), torch.tensor([2]), torch.tensor([4.0]), 3),                   # direction
              (torch.tensor([1, 0, 1, 1]), torch.tensor([2, 1, 2, 2]), torch.tensor([1.0, 2.0, 3.0, 4.0]), 3),   # duplicates
              (torch.tensor([2, 1]), torch.tensor([1, 2]), torch.tensor([1.0, -1.0], dtype=torch.float64), 3),
          ]
          against(adjacency, _ref, cases + rand_cases(_gen, 200), same=_same, show=_show)
