id: py-sorting
title: Sorting — sorted, key, cmp_to_key
summary: Order anything in one line with sorted()/list.sort() and the right key function.
links:
  - to: py-lists
    kind: prereq
    note: list.sort() is a list method; sorted() always returns a new list.
  - to: py-dict-counter
    kind: uses
    note: Ranking keys by count (sorted(d, key=d.get) or Counter.most_common) is the most common sort in practice.
lesson: |
  Two ways to sort. They differ in **what they return**.

  ```python
  nums = [3, 1, 2]
  a = sorted(nums)          # NEW list [1, 2, 3]; nums untouched. Works on any iterable.
  nums.sort()               # sorts IN PLACE, returns None
  res = nums.sort()         # BUG: res is None
  ```

  Both take the same two keyword arguments: `key=` and `reverse=`.

  **key=** is a function applied to each element once; elements are ordered by its result.

  ```python
  words.sort(key=len)                          # by length
  sorted(pairs, key=lambda p: p[1])            # by 2nd field
  sorted(words, key=str.lower)                 # case-insensitive
  sorted(nums, reverse=True)                   # descending
  ```

  **Multi-key: return a tuple.** Tuples compare element by element, so
  `key=lambda p: (p[1], p[0])` sorts by the 2nd field, then breaks ties on the 1st.

  **Mixed directions: negate the numeric part.** `reverse=True` flips *every* key at once, so for
  "count descending, then name ascending":

  ```python
  sorted(items, key=lambda x: (-x[1], x[0]))
  ```

  You can't negate a string. Then use two **stable** passes, secondary key first:
  `xs.sort(key=lambda x: x[1])` then `xs.sort(key=lambda x: x[0], reverse=True)`.

  **Stability.** Python's sort (Timsort) is stable: elements with equal keys keep their original
  order. That's what makes the two-pass trick work.

  **Dicts by value**

  ```python
  d = {"a": 3, "b": 1, "c": 2}
  sorted(d)                                    # KEYS sorted: ['a', 'b', 'c']
  sorted(d, key=d.get, reverse=True)           # keys by value: ['a', 'c', 'b']
  sorted(d.items(), key=lambda kv: kv[1])      # (key, value) pairs by value
  ```

  **Strings.** `sorted("bca")` gives a **list** `['a', 'b', 'c']`; join it back with
  `"".join(sorted(s))`. Sorted string = canonical form for anagrams.

  **Custom comparator: `functools.cmp_to_key`.** When the order isn't "compare one key" but
  "compare two elements against each other" (e.g. Largest Number: put `a` before `b` if `a+b > b+a`).
  The comparator returns a negative number if `a` goes first, positive if `b` goes first, 0 if tied.

  ```python
  from functools import cmp_to_key

  def cmp(a, b):
      if a + b > b + a:
          return -1
      if a + b < b + a:
          return 1
      return 0

  strs.sort(key=cmp_to_key(cmp))
  ```

  **Complexity:** O(n log n) time, O(n) extra memory. Nearly-sorted input is close to O(n).
  Comparing strings costs O(length), so sorting n strings of length L is O(n L log n).

  **Pitfalls**
  - `x = lst.sort()` → `x` is `None`. Use `sorted` when you need the value.
  - `sorted(d)` sorts the dict's **keys**, not its items.
  - `reverse=True` reverses all tuple keys; use negation for mixed directions.
  - Mixing types (`None` with `int`, `str` with `int`) raises `TypeError`.
drills:
  - id: sorted-copy
    prompt: Put a **new** list with `nums` sorted in descending order into `res`. Leave `nums` unchanged.
    setup: |
      nums = [4, 1, 9, 3]
    solution: |
      res = sorted(nums, reverse=True)
    check: |
      assert res == [9, 4, 3, 1], f"res = {res!r}"
      assert nums == [4, 1, 9, 3], f"nums was modified: {nums!r}"
  - id: sort-in-place-key
    prompt: Sort `words` **in place** by length. (Ties keep their original order. Why?)
    setup: |
      words = ["ccc", "a", "bb", "dd", "e"]
    solution: |
      words.sort(key=len)
    check: |
      assert words == ["a", "e", "bb", "dd", "ccc"], f"words = {words!r}"
  - id: mixed-directions
    prompt: Put `people` sorted by age **descending**, then name **ascending**, into `res`.
    setup: |
      people = [("dan", 25), ("cat", 30), ("bob", 25), ("ann", 30)]
    solution: |
      res = sorted(people, key=lambda p: (-p[1], p[0]))
    check: |
      assert res == [("ann", 30), ("cat", 30), ("bob", 25), ("dan", 25)], f"res = {res!r}"
  - id: dict-by-value
    prompt: Put the **keys** of `counts`, ordered by their value from highest to lowest, into `res`.
    setup: |
      counts = {"a": 3, "b": 1, "c": 2}
    solution: |
      res = sorted(counts, key=counts.get, reverse=True)
    check: |
      assert res == ["a", "c", "b"], f"res = {res!r}"
  - id: sort-string
    prompt: Put the characters of `s` in sorted order, **as a string**, into `res`.
    setup: |
      s = "banana"
    solution: |
      res = "".join(sorted(s))
    check: |
      assert res == "aaabnn", f"res = {res!r}"
  - id: cmp-to-key
    prompt: Sort `words` into `res` using the two-argument comparator `cmp` defined in setup.
    setup: |
      from functools import cmp_to_key

      def cmp(a, b):          # shorter first, then reverse alphabetical
          if len(a) != len(b):
              return len(a) - len(b)
          return -1 if a > b else (1 if a < b else 0)

      words = ["bb", "c", "aa", "a", "ddd"]
    solution: |
      res = sorted(words, key=cmp_to_key(cmp))
    check: |
      assert res == ["c", "a", "bb", "aa", "ddd"], f"res = {res!r}"
classics:
  - id: largest-number
    title: Largest Number
    url: https://leetcode.com/problems/largest-number/
    difficulty: Medium
    prompt: |
      Given a list of non-negative integers `nums`, arrange them so they form the largest number
      and return it **as a string**. Example: `[3, 30, 34, 5, 9]` → `"9534330"`.
    starter: |
      from functools import cmp_to_key

      def largestNumber(nums):
          pass
    hints:
      - Plain string sort fails ("3" vs "30"). Decide the order of two numbers `a`, `b` by comparing `a+b` with `b+a` as strings.
      - That's a pairwise rule, not a key → `cmp_to_key`.
      - 'Edge case: all zeros. `[0, 0]` must give `"0"`, not `"00"`.'
    solution: |
      from functools import cmp_to_key

      def largestNumber(nums):
          strs = [str(x) for x in nums]

          def cmp(a, b):
              if a + b > b + a:
                  return -1
              if a + b < b + a:
                  return 1
              return 0

          strs.sort(key=cmp_to_key(cmp))
          res = "".join(strs)
          return "0" if res[0] == "0" else res
    check: |
      res = largestNumber([10, 2])
      assert res == "210", f"res = {res!r}"
      res = largestNumber([3, 30, 34, 5, 9])
      assert res == "9534330", f"res = {res!r}"
      res = largestNumber([0, 0])
      assert res == "0", f"res = {res!r}"
      res = largestNumber([1])
      assert res == "1", f"res = {res!r}"
      res = largestNumber([432, 43243])
      assert res == "43243432", f"res = {res!r}"
    takeaway: Order defined by comparing two elements (not one key) → functools.cmp_to_key.
  - id: merge-intervals
    title: Merge Intervals
    url: https://leetcode.com/problems/merge-intervals/
    difficulty: Medium
    prompt: |
      Given `intervals` as a list of `[start, end]`, merge all overlapping intervals and return the
      result sorted by start. Touching intervals (`[1, 4]` and `[4, 5]`) overlap.
    starter: |
      def merge(intervals):
          pass
    hints:
      - Sort by start first. After that, an interval can only overlap the last merged one.
      - If `start <= merged[-1][1]`, extend the end with `max`; otherwise append a new interval.
    solution: |
      def merge(intervals):
          merged = []
          for s, e in sorted(intervals, key=lambda iv: iv[0]):
              if merged and s <= merged[-1][1]:
                  merged[-1][1] = max(merged[-1][1], e)
              else:
                  merged.append([s, e])
          return merged
    check: |
      res = merge([[1, 3], [2, 6], [8, 10], [15, 18]])
      assert res == [[1, 6], [8, 10], [15, 18]], f"res = {res!r}"
      res = merge([[1, 4], [4, 5]])
      assert res == [[1, 5]], f"res = {res!r}"
      res = merge([[1, 4], [0, 4]])
      assert res == [[0, 4]], f"res = {res!r}"
      res = merge([[1, 4], [2, 3]])
      assert res == [[1, 4]], f"res = {res!r}"
      res = merge([[5, 6]])
      assert res == [[5, 6]], f"res = {res!r}"
    takeaway: Interval problems → sort by start, then a single pass comparing against the last kept interval.
