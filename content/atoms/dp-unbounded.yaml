id: dp-unbounded
title: Unbounded knapsack (coin change)
summary: "Items reusable: iterate capacity FORWARDS. Items-outer counts combinations, capacity-outer counts permutations."
links:
  - to: dp-knapsack-01
    kind: variant
    note: "Same dp over capacity; the only code difference is the capacity loop direction: backwards = each item once, forwards = unlimited reuse."
  - to: graph-bfs
    kind: contrast
    note: "Fewest coins is also a shortest path over amounts (each coin is an edge of weight 1), so BFS works too; DP is simpler and has no queue."
lesson: |
  **Shape:** like 0/1 knapsack (items + a target amount), but every item has an **unlimited supply**.

  **Recognition signals**
  - "Infinite number of each coin", "you may reuse", "any number of times" → unbounded.
  - "Fewest coins to make `amount`" → min DP (Coin Change).
  - "Number of **combinations** that make up `amount`" (order doesn't matter) → Coin Change II.
  - "Number of possible **combinations**... different sequences are counted as different" → that's
    actually **permutations** (Combination Sum IV, despite the name). Read the examples!
  - "Perfect squares", "minimum cost for tickets", "word break" (reusable words) → same family.

  **The five answers for Coin Change (fewest coins)**

  | Question | Answer |
  |---|---|
  | State | `dp[a]` = fewest coins that sum to exactly `a` |
  | Transition | last coin used was `c`: `dp[a] = min(dp[a], dp[a - c] + 1)` |
  | Base | `dp[0] = 0`; everything else `inf` (unreachable until proven otherwise) |
  | Order | `a` ascending (forwards) |
  | Answer | `dp[amount]`, or `-1` if it's still `inf` |

  ```python
  dp = [0] + [float("inf")] * amount
  for c in coins:
      for a in range(c, amount + 1):      # FORWARDS: dp[a - c] may already use c -> reuse allowed
          dp[a] = min(dp[a], dp[a - c] + 1)
  answer = dp[amount] if dp[amount] != float("inf") else -1
  ```

  **Direction is the whole difference with 0/1 knapsack**

  | | capacity loop | `dp[c - w]` means |
  |---|---|---|
  | 0/1 (each item once) | `range(T, w - 1, -1)` backwards | best **without** this item yet |
  | unbounded (reuse) | `range(w, T + 1)` forwards | best that **may already include** this item |

  **Counting: the loop ORDER decides what you count.** `dp[0] = 1`, transition `dp[a] += dp[a - c]`.

  ```python
  # combinations (Coin Change II): coins OUTER
  dp = [1] + [0] * amount
  for c in coins:
      for a in range(c, amount + 1):
          dp[a] += dp[a - c]

  # permutations (Combination Sum IV): amount OUTER
  dp = [1] + [0] * amount
  for a in range(1, amount + 1):
      for c in coins:
          if c <= a:
              dp[a] += dp[a - c]
  ```

  Why: with coins outer, by the time coin `2` is processed, coin `1` is finished, so every way is built
  as "all 1s, then all 2s, ...": each multiset is counted **once**. With amount outer, for every amount
  you try every coin as the *last* one, so `1+2` and `2+1` are both counted.
  Example `coins = [1, 2]`, `amount = 3`: combinations = 2 (`1+1+1`, `1+2`), permutations = 3 (`1+1+1`, `1+2`, `2+1`).

  For **min / max** problems the loop order doesn't matter (min doesn't care how many ways reach a value).

  **Pitfalls**
  - Initialising min-DP with `0` instead of `inf`: everything looks reachable for free.
  - Returning `inf` instead of `-1`.
  - Counting: `dp[0] = 1` (one way to make 0: no coins), not 0.
  - Greedy "take the biggest coin" fails: `coins = [1, 3, 4]`, `amount = 6` → greedy 4+1+1, optimal 3+3.

  **Complexity:** O(len(coins) · amount) time, O(amount) space.
drills:
  - id: min-coins-init
    prompt: |
      Fewest coins. Replace the `dp = None` line with the correct initial table
      (`dp[a]` = fewest coins for amount `a`). The loops and answer are given.
    setup: |
      coins = [1, 2, 5]
      amount = 11
    starter: |
      dp = None  # TODO
      for c in coins:
          for a in range(c, amount + 1):
              dp[a] = min(dp[a], dp[a - c] + 1)
      res = dp[amount] if dp[amount] != float("inf") else -1
    solution: |
      dp = [0] + [float("inf")] * amount
      for c in coins:
          for a in range(c, amount + 1):
              dp[a] = min(dp[a], dp[a - c] + 1)
      res = dp[amount] if dp[amount] != float("inf") else -1
    check: |
      assert res == 3, f"res = {res!r}"
      assert len(dp) == amount + 1, f"len(dp) = {len(dp)}"
  - id: min-coins-transition
    prompt: |
      Fewest coins, table initialised. Write the **transition line** (last coin used is `c`).
      The skeleton puts the answer in `res`.
    setup: |
      coins = [2, 5, 10, 1]
      amount = 27
    starter: |
      INF = float("inf")
      dp = [0] + [INF] * amount
      for c in coins:
          for a in range(c, amount + 1):
              pass
      res = dp[amount] if dp[amount] != INF else -1
    solution: |
      INF = float("inf")
      dp = [0] + [INF] * amount
      for c in coins:
          for a in range(c, amount + 1):
              dp[a] = min(dp[a], dp[a - c] + 1)
      res = dp[amount] if dp[amount] != INF else -1
    check: |
      assert res == 4, f"res = {res!r}  (10 + 10 + 5 + 2)"
  - id: combinations-loops
    prompt: |
      Count the **combinations** (order doesn't matter) of `coins` that sum to `amount`.
      Write **both loops** and the transition. `dp[a]` = number of combinations for `a`.
    setup: |
      coins = [1, 2, 5]
      amount = 5
    starter: |
      dp = [1] + [0] * amount
      # loops + transition here
      res = dp[amount]
    solution: |
      dp = [1] + [0] * amount
      for c in coins:
          for a in range(c, amount + 1):
              dp[a] += dp[a - c]
      res = dp[amount]
    check: |
      assert res != 9, "res = 9: that counts permutations. Which loop must be outer for combinations?"
      assert res == 4, f"res = {res!r}"
  - id: permutations-loops
    prompt: |
      Count the ordered sequences (permutations) of numbers from `nums` (reusable) that sum to `target`.
      Write **both loops** and the transition. `dp[t]` = number of sequences summing to `t`.
    setup: |
      nums = [1, 2, 3]
      target = 4
    starter: |
      dp = [1] + [0] * target
      # loops + transition here
      res = dp[target]
    solution: |
      dp = [1] + [0] * target
      for t in range(1, target + 1):
          for x in nums:
              if x <= t:
                  dp[t] += dp[t - x]
      res = dp[target]
    check: |
      assert res != 4, "res = 4: that counts combinations. Which loop must be outer for permutations?"
      assert res == 7, f"res = {res!r}"
  - id: flip-to-unbounded
    prompt: |
      The starter is a **0/1** reachability DP. Change it so each item can be used **any number of times**
      (one line changes).
    setup: |
      nums = [3, 5]
      T = 11
    starter: |
      dp = [False] * (T + 1)
      dp[0] = True
      for w in nums:
          for c in range(T, w - 1, -1):
              dp[c] = dp[c] or dp[c - w]
    solution: |
      dp = [False] * (T + 1)
      dp[0] = True
      for w in nums:
          for c in range(w, T + 1):
              dp[c] = dp[c] or dp[c - w]
    check: |
      reach = [c for c in range(T + 1) if dp[c]]
      assert reach == [0, 3, 5, 6, 8, 9, 10, 11], f"reachable = {reach!r}"
classics:
  - id: coin-change
    title: Coin Change
    url: https://leetcode.com/problems/coin-change/
    difficulty: Medium
    prompt: |
      Given coin denominations `coins` (unlimited supply of each) and an `amount`, return the fewest
      coins that make up that amount, or `-1` if it can't be made.
    starter: |
      def coinChange(coins, amount):
          pass
    hints:
      - Greedy (biggest coin first) fails, e.g. coins [1, 3, 4], amount 6.
      - "State: dp[a] = fewest coins for amount a. dp[0] = 0, the rest start at infinity."
      - "Transition: dp[a] = min(dp[a], dp[a - c] + 1) for each coin c <= a. Capacity forwards (coins are reusable)."
    solution: |
      def coinChange(coins, amount):
          INF = float("inf")
          dp = [0] + [INF] * amount
          for c in coins:
              for a in range(c, amount + 1):
                  if dp[a - c] + 1 < dp[a]:
                      dp[a] = dp[a - c] + 1
          return dp[amount] if dp[amount] != INF else -1
    check: |
      for coins, amount, want in [([1, 2, 5], 11, 3), ([2], 3, -1), ([1], 0, 0), ([1, 3, 4], 6, 2),
                                  ([186, 419, 83, 408], 6249, 20), ([2, 5, 10, 1], 27, 4)]:
          got = coinChange(coins, amount)
          assert got == want, f"coinChange({coins!r}, {amount}) = {got!r}, expected {want}"
    takeaway: "Fewest items with reuse: dp[0] = 0, others inf, dp[a] = min(dp[a], dp[a-c] + 1), capacity loop forwards."
  - id: coin-change-ii
    title: Coin Change II
    url: https://leetcode.com/problems/coin-change-ii/
    difficulty: Medium
    prompt: |
      Return the number of **combinations** of coins (unlimited supply) that make up `amount`.
      `1+2` and `2+1` are the same combination. If no combination works, return 0.
    starter: |
      def change(amount, coins):
          pass
    hints:
      - "Counting DP: dp[0] = 1 (one way to make 0: use no coins), dp[a] += dp[a - c]."
      - Order doesn't matter, so each multiset must be built in one canonical order. Which loop goes outside?
      - Coins outer, amount inner (forwards).
    solution: |
      def change(amount, coins):
          dp = [1] + [0] * amount
          for c in coins:
              for a in range(c, amount + 1):
                  dp[a] += dp[a - c]
          return dp[amount]
    check: |
      for amount, coins, want in [(5, [1, 2, 5], 4), (3, [2], 0), (10, [10], 1), (0, [7], 1),
                                  (3, [1, 2], 2), (500, [3, 5, 7, 8, 9, 10, 11], 35502874)]:
          got = change(amount, coins)
          assert got == want, f"change({amount}, {coins!r}) = {got!r}, expected {want}"
    takeaway: "Count combinations → items outer, capacity inner forwards; swap the loops and you count permutations."
