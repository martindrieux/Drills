id: py-dict-counter
title: dict, defaultdict, Counter
summary: O(1) lookup tables. Counting, grouping and remembering what you've seen with dict, defaultdict and Counter.
links:
  - to: py-sets
    kind: contrast
    note: A set is a dict with keys only. Use a dict when each key needs a value (count, index, list).
lesson: |
  A `dict` maps hashable keys to values with **average O(1)** get, set, delete and `in`.
  Since Python 3.7 it remembers **insertion order**.

  **Plain dict: the calls you need**

  ```python
  d = {}
  d["a"] = 1
  d["zz"]                     # KeyError if missing
  d.get("zz", 0)              # default instead of KeyError
  d[k] = d.get(k, 0) + 1      # counting without imports
  d.setdefault(k, []).append(x)   # insert [] if missing, then append
  d.pop(k)                    # remove and return (KeyError if missing)
  d.pop(k, None)              # ... or a default
  k in d                      # checks KEYS, O(1)
  for k, v in d.items(): ...  # also d.keys(), d.values()
  inv = {v: k for k, v in d.items()}   # dict comprehension
  ```

  **defaultdict: missing keys get a fresh default**

  ```python
  from collections import defaultdict
  count = defaultdict(int)     # missing -> 0
  adj = defaultdict(list)      # missing -> []
  seen_by = defaultdict(set)   # missing -> set()
  count[x] += 1
  adj[u].append(v)
  ```

  **Counter: a dict specialised for counting**

  ```python
  from collections import Counter
  c = Counter("mississippi")   # Counter({'i': 4, 's': 4, 'p': 2, 'm': 1})
  c["z"]                       # 0, and does NOT insert the key
  c.most_common(2)             # [('i', 4), ('s', 4)]  (ties keep first-seen order)
  c.update("ss")               # add more counts
  c.total()                    # sum of counts (3.10+)
  Counter(a) == Counter(b)     # same multiset -> anagram test
  Counter(a) - Counter(b)      # subtract, dropping counts <= 0
  Counter(a) + Counter(b)      # add counts
  Counter(a) & Counter(b)      # min of each count; | is max
  not (Counter(note) - Counter(mag))   # can `note` be built from `mag`?
  ```

  **Keys must be hashable**: str, int, tuple (of hashables), frozenset. Lists, sets and dicts are not.

  ```python
  grid_vals = {(r, c): v}                  # coordinates as tuple keys
  key = "".join(sorted(word))              # anagram key, O(k log k)
  key = tuple(counts26)                    # anagram key from a 26-count list, O(k)
  ```

  **Grouping pattern**

  ```python
  groups = defaultdict(list)
  for w in words:
      groups[key(w)].append(w)
  result = list(groups.values())
  ```

  **Seen-index pattern** (two sum and friends): store `value -> index` as you go, and look up the
  complement before inserting the current item.

  **Pitfalls**
  - Reading `dd[k]` on a defaultdict **inserts** `k`. Test with `k in dd` when you don't want that.
  - Don't add or delete keys while iterating over a dict; iterate over `list(d)` instead.
  - `max(d)` gives the largest **key**. The key with the largest value is `max(d, key=d.get)`.
  - `d.keys()`, `d.values()` are views, not lists; wrap in `list(...)` to index them.
drills:
  - id: get-count
    prompt: Count the words of `words` into a **plain dict** `freq` using `.get`. Then remove `"the"` from it with `pop`, storing its count in `gone`.
    setup: |
      words = ["the", "cat", "the", "hat", "the"]
    solution: |
      freq = {}
      for w in words:
          freq[w] = freq.get(w, 0) + 1
      gone = freq.pop("the")
    check: |
      assert type(freq) is dict, f"type(freq) = {type(freq)!r}"
      assert gone == 3, f"gone = {gone!r}"
      assert freq == {"cat": 1, "hat": 1}, f"freq = {freq!r}"
  - id: setdefault
    prompt: Build `by_len`, a plain dict mapping word length to the list of words of that length (in order), using `setdefault`.
    setup: |
      words = ["hi", "cat", "yo", "dog", "a"]
    solution: |
      by_len = {}
      for w in words:
          by_len.setdefault(len(w), []).append(w)
    check: |
      assert by_len == {2: ["hi", "yo"], 3: ["cat", "dog"], 1: ["a"]}, f"by_len = {by_len!r}"
  - id: defaultdict-adj
    prompt: Build `adj`, a `defaultdict(list)` adjacency list for the **undirected** `edges`.
    setup: |
      from collections import defaultdict
      edges = [(1, 2), (1, 3), (2, 3)]
    solution: |
      adj = defaultdict(list)
      for u, v in edges:
          adj[u].append(v)
          adj[v].append(u)
    check: |
      assert isinstance(adj, defaultdict), f"type(adj) = {type(adj)!r}"
      assert dict(adj) == {1: [2, 3], 2: [1, 3], 3: [1, 2]}, f"adj = {dict(adj)!r}"
  - id: most-common
    prompt: Using `Counter`, set `top` to the list of the 2 most common characters of `s` (characters only, most common first).
    setup: |
      from collections import Counter
      s = "hello world"
    solution: |
      top = [ch for ch, _ in Counter(s).most_common(2)]
    check: |
      assert top == ["l", "o"], f"top = {top!r}"
  - id: counter-compare
    prompt: Set `same` to whether `a` and `b` are anagrams, and `can_build` to whether `note` can be built from the letters of `mag` (each letter used once). Use `Counter`.
    setup: |
      from collections import Counter
      a, b = "listen", "silent"
      note, mag = "aab", "baa c"
    solution: |
      same = Counter(a) == Counter(b)
      can_build = not (Counter(note) - Counter(mag))
    check: |
      assert same is True, f"same = {same!r}"
      assert can_build is True, f"can_build = {can_build!r}"
  - id: tuple-keys
    prompt: With one dict comprehension, set `pos` to a dict mapping `(row, col)` to the value for every **non-zero** cell of `grid`.
    setup: |
      grid = [[0, 5], [7, 0]]
    solution: |
      pos = {(r, c): v for r, row in enumerate(grid) for c, v in enumerate(row) if v}
    check: |
      assert pos == {(0, 1): 5, (1, 0): 7}, f"pos = {pos!r}"
classics:
  - id: two-sum
    title: Two Sum
    url: https://leetcode.com/problems/two-sum/
    difficulty: Easy
    prompt: |
      Return the indices `[i, j]` (i < j) of the two numbers in `nums` that add up to `target`.
      Exactly one answer exists, and you may not use the same element twice. Aim for O(n).
    starter: |
      def twoSum(nums, target):
          pass
    hints:
      - For each `x`, the number you need is `target - x`.
      - Keep a dict `value -> index` of what you've already passed. Look up before inserting, so `[3, 3]` works.
    solution: |
      def twoSum(nums, target):
          seen = {}
          for i, x in enumerate(nums):
              if target - x in seen:
                  return [seen[target - x], i]
              seen[x] = i
    check: |
      r = twoSum([2, 7, 11, 15], 9)
      assert r == [0, 1], f"r = {r!r}"
      r = twoSum([3, 2, 4], 6)
      assert r == [1, 2], f"r = {r!r}"
      r = twoSum([3, 3], 6)
      assert r == [0, 1], f"duplicates: r = {r!r}"
      r = twoSum([-1, -2, -3, -4, -5], -8)
      assert r == [2, 4], f"negatives: r = {r!r}"
    takeaway: Pair-finding in one pass → dict of `value -> index`, check the complement before inserting.
  - id: group-anagrams
    title: Group Anagrams
    url: https://leetcode.com/problems/group-anagrams/
    difficulty: Medium
    prompt: |
      Group the strings of `strs` that are anagrams of each other. Return a list of groups, in any order.
    starter: |
      def groupAnagrams(strs):
          pass
    hints:
      - Two words are anagrams iff they have the same canonical key. `"".join(sorted(w))` works.
      - Use a `defaultdict(list)` keyed by that canonical form.
      - Lists aren't hashable. If you key by letter counts, convert them to a tuple.
    solution: |
      from collections import defaultdict

      def groupAnagrams(strs):
          groups = defaultdict(list)
          for w in strs:
              groups["".join(sorted(w))].append(w)
          return list(groups.values())
    check: |
      def norm(g):
          return sorted(sorted(x) for x in (g or []))
      r = groupAnagrams(["eat", "tea", "tan", "ate", "nat", "bat"])
      assert norm(r) == [["ate", "eat", "tea"], ["bat"], ["nat", "tan"]], f"r = {r!r}"
      r = groupAnagrams([""])
      assert norm(r) == [[""]], f"r = {r!r}"
      r = groupAnagrams(["a"])
      assert norm(r) == [["a"]], f"r = {r!r}"
      r = groupAnagrams(["ab", "ba", "abc"])
      assert norm(r) == [["ab", "ba"], ["abc"]], f"r = {r!r}"
    takeaway: Grouping → `defaultdict(list)` keyed by a canonical, hashable form (sorted string or count tuple).
